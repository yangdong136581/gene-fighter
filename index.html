// entities.js — 玩家飞船 / 敌人 / 子弹 / 粒子
// ═══════════════════════════════════════════════════════
// (G = window.Game)
// ═══════════════ 玩家飞船 ═══════════════
G.Player = class Player {
  constructor(x, y, shipConfig) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.angle = -Math.PI / 2;
    this.speed = 320;
    this.invincible = 0;
    this.thrusterPhase = 0;
    this.engineGlow = 0;
    this.alive = true;
    this.fireCooldown = 0;

    // 飞船配置
    const sc = shipConfig || {};
    this.maxHp = sc.maxHp || 100;
    this.hp = this.maxHp;
    this.regen = sc.regen || 0;
    this.reflect = sc.reflect || 0;
    this.maxShield = sc.maxShield || 0;
    this.shield = this.maxShield;
    this.shieldRegenDelay = 3; // 受伤后3秒回盾
    this.shieldRegenTimer = 0;
    this.reactive = sc.reactive || 0; // 反应装甲：受击反击子弹数
    this.visual = sc.visual || { scale: 1, hue: 210, hasShield: false, hasSpikes: false, hasAura: false, color: '#5a7aac' };
    this.radius = 20 * this.visual.scale;
  }

  update(dt, input, events) {
    const move = input.movement;
    const spd = this.speed * (G.hasGene('fast') ? 1.5 : 1); // 迅捷基因：移速+50%
    this.vx = G.lerp(this.vx, move.x * spd, 8 * dt);
    this.vy = G.lerp(this.vy, move.y * spd, 8 * dt);
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.x = G.clamp(this.x, this.radius, G.renderer.width - this.radius);
    this.y = G.clamp(this.y, this.radius, G.renderer.height - this.radius);
    this.angle = G.angle(this.x, this.y, input.mouse.x, input.mouse.y);
    this.thrusterPhase += dt * 15;
    const moving = Math.abs(move.x) + Math.abs(move.y) > 0;
    this.engineGlow = G.lerp(this.engineGlow, moving ? 1 : 0.3, 4 * dt);
    if (this.invincible > 0) this.invincible -= dt;
    if (this.fireCooldown > 0) this.fireCooldown -= dt;

    // 回血（再生基因额外+10/秒）
    const regenTotal = this.regen + (G.hasGene('healer') ? 10 : 0);
    if (regenTotal > 0 && this.hp < this.maxHp) {
      this.hp = Math.min(this.maxHp, this.hp + regenTotal * dt);
    }
    // 回盾
    if (this.maxShield > 0) {
      this.shieldRegenTimer -= dt;
      if (this.shieldRegenTimer <= 0 && this.shield < this.maxShield) {
        this.shield = Math.min(this.maxShield, this.shield + this.maxShield * 0.1 * dt);
      }
    }
  }

  takeDamage(amount, events, srcX, srcY) {
    if (this.invincible > 0) return 0;
    if (G.hasGene('tank')) amount *= 0.5; // 坚韧基因：受到伤害减半
    // 护盾优先吸收
    if (this.shield > 0) {
      const abs = Math.min(this.shield, amount);
      this.shield -= abs; amount -= abs;
    }
    this.hp -= amount;
    this.invincible = 0.5;
    this.shieldRegenTimer = this.shieldRegenDelay;
    const reflected = amount > 0 ? this.reflect + (G.hasGene('reflector') ? 15 : 0) : 0; // 反射基因：反伤+15
    // 反应装甲：每次受到伤害，触发 点数 次反应，每次向伤害源发射一整轮武器齐射
    if (amount > 0 && this.reactive > 0 && G.weaponSystem && G.weaponSystem.weapon) {
      const ang = (typeof srcX === 'number') ? G.angle(this.x, this.y, srcX, srcY) : G.RAND() * G.TWO_PI;
      G.weaponSystem.fireReactive(this, ang, this.reactive);
    }
    events.emit('player:hit', { damage: amount, hp: this.hp, reflected });
    if (this.hp <= 0) { this.hp = 0; this.alive = false; events.emit('player:death', {}); }
    return reflected;
  }

  draw(ctx, time) {
    const vs = this.visual.scale;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.scale(vs, vs);

    const flicker = this.invincible > 0 && Math.sin(time * 30) > 0;
    if (flicker) ctx.globalAlpha = 0.4;

    // ── 护盾光环 ──
    if (this.maxShield > 0 && this.shield > 0) {
      const sr = this.shield / this.maxShield;
      ctx.strokeStyle = `rgba(80,180,255,${0.25 + sr * 0.35})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(time*3)*2, 0, G.TWO_PI * sr); ctx.stroke();
    }
    // ── 回复光环 ──
    if (this.visual.hasAura) {
      ctx.strokeStyle = `rgba(80,255,120,${0.15 + 0.1*Math.sin(time*4)})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, 28 + Math.sin(time*2)*4, 0, G.TWO_PI); ctx.stroke();
    }

    // ── 引擎火焰（尾部双喷口） ──
    const flameLen = 8 + Math.sin(this.thrusterPhase) * 4 * this.engineGlow;
    for (const ey of [-7, 7]) {
      const flameGrad = ctx.createLinearGradient(-14 - flameLen, ey, -11, ey);
      flameGrad.addColorStop(0, 'rgba(0,150,255,0)');
      flameGrad.addColorStop(0.5, 'rgba(80,180,255,0.7)');
      flameGrad.addColorStop(1, 'rgba(200,230,255,0.9)');
      ctx.fillStyle = flameGrad;
      ctx.beginPath(); ctx.moveTo(-11, ey - 3); ctx.lineTo(-13 - flameLen, ey); ctx.lineTo(-11, ey + 3); ctx.closePath(); ctx.fill();
    }

    // ── 反伤尖刺（圆周均布） ──
    if (this.visual.hasSpikes) {
      ctx.fillStyle = `rgba(255,160,60,${0.5+0.3*Math.sin(time*5)})`;
      for (let i = 0; i < 8; i++) {
        const sa = i * G.TWO_PI / 8;
        ctx.beginPath();
        ctx.moveTo(Math.cos(sa)*20, Math.sin(sa)*20);
        ctx.lineTo(Math.cos(sa-0.18)*13, Math.sin(sa-0.18)*13);
        ctx.lineTo(Math.cos(sa+0.18)*13, Math.sin(sa+0.18)*13);
        ctx.closePath(); ctx.fill();
      }
    }

    // ── 圆形主体 ──
    ctx.shadowColor = this.visual.color; ctx.shadowBlur = 12;
    const bodyGrad = ctx.createRadialGradient(3, -3, 2, 0, 0, 15);
    bodyGrad.addColorStop(0, '#fff');
    bodyGrad.addColorStop(0.4, this.visual.color);
    bodyGrad.addColorStop(1, G.hslToHex(this.visual.hue, 40, 25));
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, G.TWO_PI); ctx.fill();
    ctx.shadowBlur = 0;

    // ── 装甲外环+侧翼细节 ──
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, G.TWO_PI); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 9, 0.6, 2.55); ctx.stroke(); // 后部弧线接缝
    ctx.beginPath(); ctx.arc(0, 0, 9, -2.55, -0.6); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; // 侧翼指示灯
    ctx.beginPath(); ctx.arc(-4, -9, 1.6, 0, G.TWO_PI); ctx.fill();
    ctx.beginPath(); ctx.arc(-4, 9, 1.6, 0, G.TWO_PI); ctx.fill();

    // ── 前部炮管（指向准星） ──
    ctx.fillStyle = G.hslToHex(this.visual.hue, 40, 30);
    ctx.fillRect(9, -2.5, 10, 5);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(17, -1.5, 3, 3);

    // ── 核心亮点（脉冲） ──
    const pulse = 0.7 + 0.3 * Math.sin(time * 4);
    ctx.fillStyle = `rgba(255,255,255,${0.75 * pulse})`;
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, G.TWO_PI); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${0.3 * pulse})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, G.TWO_PI); ctx.stroke();

    ctx.restore();
  }
};

// ═══════════════ 无人机系统（无人机加点替代基础射击） ═══════════════
G.Drone = class Drone {
  constructor() {
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.radius = 9; this.angle = 0;
    this.alive = true; this.hp = 10; this.maxHp = 10;
    this.respawnTimer = 0; this.fireCooldown = 0; this.invincible = 0; this.contactCd = 0;
    this.phase = Math.random() * G.TWO_PI;
  }

  spawn(player) {
    this.x = player.x + (G.RAND() - 0.5) * 40;
    this.y = player.y + (G.RAND() - 0.5) * 40;
    this.vx = 0; this.vy = 0;
    this.maxHp = Math.max(5, Math.ceil(player.maxHp * 0.05)); // 血量=母船5%
    this.hp = this.maxHp;
    this.alive = true; this.respawnTimer = 0; this.invincible = 1;
    G.particles.explosion(this.x, this.y, '#6cf', 20);
  }

  takeDamage(amount) {
    if (!this.alive || this.invincible > 0) return;
    this.hp -= amount; this.invincible = 0.8;
    if (this.hp <= 0) {
      this.alive = false; this.respawnTimer = 5; // 死亡后5秒由母船体内重生
      G.particles.explosion(this.x, this.y, '#6cf', 24);
    }
  }

  update(dt, player, input) {
    if (!this.alive) {
      this.respawnTimer -= dt;
      if (this.respawnTimer <= 0 && player && player.alive) this.spawn(player);
      return;
    }
    if (this.invincible > 0) this.invincible -= dt;
    if (this.fireCooldown > 0) this.fireCooldown -= dt;
    if (this.contactCd > 0) this.contactCd -= dt;
    this.phase += dt * 10;
    // 移动受左键控制：按住左键才朝准星方向移动（移动迅速）
    const dx = input.mouse.x - this.x, dy = input.mouse.y - this.y;
    const d = Math.hypot(dx, dy);
    if (input.shooting && d > 24) {
      this.vx = G.lerp(this.vx, (dx / d) * 700, 6 * dt);
      this.vy = G.lerp(this.vy, (dy / d) * 700, 6 * dt);
    } else { this.vx *= 0.9; this.vy *= 0.9; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.x = G.clamp(this.x, this.radius, G.renderer.width - this.radius);
    this.y = G.clamp(this.y, this.radius, G.renderer.height - this.radius);
    // 飞行时按飞行方向自动调整机体角度
    const spd = Math.hypot(this.vx, this.vy);
    if (spd > 40) this.angle = Math.atan2(this.vy, this.vx);

    // 自动射击离自己最近的敌人：发射母船子弹类型
    const w = G.weaponSystem.weapon;
    if (!w || this.fireCooldown > 0) return;
    let target = null, nd = 480;
    const act = G.enemyPool.active;
    for (let i = 0; i < act.length; i++) {
      const e = act[i];
      if (!e.alive || e.charmed || e.phaseShift > 0) continue;
      const dist = G.dist(this.x, this.y, e.x, e.y);
      if (dist < nd) { nd = dist; target = e; }
    }
    if (target) {
      const aim = G.angle(this.x, this.y, target.x, target.y);
      if (spd <= 40) this.angle = aim; // 悬停时机头指向目标
      G.weaponSystem.fireVolley(this.x + Math.cos(aim) * 10, this.y + Math.sin(aim) * 10, aim, null);
      // 总射速与母船一致：单机间隔 = 机数 / 射速
      const n = Math.max(1, w.droneCount || 1);
      this.fireCooldown = n / w.fireRate / (G.hasGene('swarm') ? 1.3 : 1);
    }
  }

  draw(ctx, time) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    if (this.invincible > 0 && Math.sin(time * 30) > 0) ctx.globalAlpha = 0.4;
    // 引擎光
    ctx.fillStyle = `rgba(100,200,255,${0.5 + 0.3 * Math.sin(this.phase)})`;
    ctx.beginPath(); ctx.arc(-8, 0, 2.5, 0, G.TWO_PI); ctx.fill();
    // 机体
    ctx.shadowColor = '#6cf'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#9cf';
    ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, -6); ctx.lineTo(-3, 0); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    // 血条
    if (this.hp < this.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(this.x - 8, this.y - this.radius - 6, 16, 2);
      ctx.fillStyle = '#6cf'; ctx.fillRect(this.x - 8, this.y - this.radius - 6, 16 * Math.max(0, this.hp / this.maxHp), 2);
    }
  }
};

// 无人机管理：数量与加点同步
G.drones = [];
G.syncDrones = function(count) {
  while (G.drones.length > count) G.drones.pop();
  while (G.drones.length < count) {
    const dr = new G.Drone();
    if (G.player && G.player.alive) dr.spawn(G.player); else { dr.alive = false; dr.respawnTimer = 1; }
    G.drones.push(dr);
  }
};
G.updateDrones = function(dt) {
  for (let i = 0; i < G.drones.length; i++) G.drones[i].update(dt, G.player, G.input);
};
G.drawDrones = function(ctx, time) {
  for (let i = 0; i < G.drones.length; i++) G.drones[i].draw(ctx, time);
};

// ═══════════════ 防御无人机系统（继承10%母船属性，卫星式护卫，不可攻击） ═══════════════
G.GuardDrone = class GuardDrone {
  constructor() {
    this.x = 0; this.y = 0; this.radius = 8;
    this.alive = false; this.respawnTimer = 0; this.invincible = 0; this.contactCd = 0;
    this.maxHp = 5; this.hp = 5;
    this.maxShield = 0; this.shield = 0; this.shieldRegenTimer = 0;
    this.regen = 0; this.reflect = 0; this.reactive = 0;
    this.phase = Math.random() * G.TWO_PI;
  }

  // 继承10%母船属性（血量/护盾/回复/反伤/反应装甲，不继承武器属性）
  spawn(player) {
    this.maxHp = Math.max(5, Math.ceil(player.maxHp * 0.1));
    this.hp = this.maxHp;
    this.maxShield = Math.round(player.maxShield * 0.1);
    this.shield = this.maxShield;
    this.regen = player.regen * 0.1;
    this.reflect = Math.round(player.reflect * 0.1);
    this.reactive = Math.round(player.reactive * 0.1);
    this.x = player.x; this.y = player.y - 30;
    this.alive = true; this.respawnTimer = 0; this.invincible = 1; this.contactCd = 0;
    this.shieldRegenTimer = 0;
    G.particles.explosion(this.x, this.y, '#4dd', 18);
  }

  takeDamage(amount, events, srcX, srcY) {
    if (!this.alive || this.invincible > 0) return 0;
    if (this.shield > 0) {
      const abs = Math.min(this.shield, amount);
      this.shield -= abs; amount -= abs;
    }
    this.shieldRegenTimer = 3;
    this.hp -= amount; // 受击无免伤时间：避免无敌间隙造成母船防御漏洞
    const reflected = amount > 0 ? this.reflect : 0;
    // 反应装甲（继承自母船）：向伤害源触发武器齐射反击
    if (amount > 0 && this.reactive > 0 && G.weaponSystem && G.weaponSystem.weapon) {
      const ang = (typeof srcX === 'number') ? G.angle(this.x, this.y, srcX, srcY) : G.RAND() * G.TWO_PI;
      G.weaponSystem.fireReactive(this, ang, this.reactive);
    }
    if (this.hp <= 0) {
      this.hp = 0; this.alive = false; this.respawnTimer = 5; // 死亡后5秒重生
      G.particles.explosion(this.x, this.y, '#4dd', 22);
    }
    return reflected;
  }

  update(dt, player, slot, aliveCount) {
    if (!this.alive) {
      this.respawnTimer -= dt;
      if (this.respawnTimer <= 0 && player && player.alive) this.spawn(player);
      return;
    }
    if (this.invincible > 0) this.invincible -= dt;
    if (this.contactCd > 0) this.contactCd -= dt;
    this.phase += dt * 6;
    // 回血/回盾：每秒回复20%血量
    if (this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.2 * dt);
    if (this.maxShield > 0) {
      this.shieldRegenTimer -= dt;
      if (this.shieldRegenTimer <= 0 && this.shield < this.maxShield) {
        this.shield = Math.min(this.maxShield, this.shield + this.maxShield * 0.1 * dt);
      }
    }
    if (!player) return;
    // 阵型：存活者按顺序补位，优先集中在母船前方（朝向准星）扇形展开，从正前方起左右交替排布
    const k = Math.ceil(slot / 2);
    const sign = slot % 2 === 0 ? -1 : 1;
    const targetA = player.angle + sign * k * 0.42;
    const targetR = 46 + Math.min(aliveCount, 8) * 2 + k * 5; // 角度越大半径越远，避免拥挤
    const tx = player.x + Math.cos(targetA) * targetR;
    const ty = player.y + Math.sin(targetA) * targetR;
    this.x = G.lerp(this.x, tx, 10 * dt); // 高收敛速度：摧毁后其它机迅速补位
    this.y = G.lerp(this.y, ty, 10 * dt);
  }

  draw(ctx, time) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.invincible > 0 && Math.sin(time * 30) > 0) ctx.globalAlpha = 0.4;
    // 护盾环
    if (this.maxShield > 0 && this.shield > 0) {
      ctx.strokeStyle = `rgba(80,220,220,${0.25 + 0.35 * (this.shield / this.maxShield)})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 4, 0, G.TWO_PI); ctx.stroke();
    }
    // 圆形机体
    const pulse = 0.8 + 0.2 * Math.sin(this.phase);
    ctx.shadowColor = '#4dd'; ctx.shadowBlur = 8;
    ctx.fillStyle = `rgba(80,220,220,${0.85 * pulse})`;
    ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, G.TWO_PI); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(220,255,255,0.8)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, this.radius - 2, 0, G.TWO_PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(0, 0, 2, 0, G.TWO_PI); ctx.fill();
    ctx.restore();
    // 血条
    if (this.hp < this.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(this.x - 8, this.y - this.radius - 7, 16, 2);
      ctx.fillStyle = '#4dd'; ctx.fillRect(this.x - 8, this.y - this.radius - 7, 16 * Math.max(0, this.hp / this.maxHp), 2);
    }
  }
};

// 防御无人机管理：数量与加点同步
G.guards = [];
G.syncGuards = function(count) {
  while (G.guards.length > count) G.guards.pop();
  while (G.guards.length < count) {
    const gd = new G.GuardDrone();
    if (G.player && G.player.alive) gd.spawn(G.player); else { gd.alive = false; gd.respawnTimer = 1; }
    G.guards.push(gd);
  }
};
G.updateGuards = function(dt) {
  // 存活者依次占槽位：某架被摧毁后其余机立即前移补位，防止前方出现漏洞
  let aliveCount = 0;
  for (let i = 0; i < G.guards.length; i++) if (G.guards[i].alive) aliveCount++;
  let slot = 0;
  for (let i = 0; i < G.guards.length; i++) {
    const g = G.guards[i];
    g.update(dt, G.player, g.alive ? slot++ : -1, aliveCount);
  }
};
G.drawGuards = function(ctx, time) {
  for (let i = 0; i < G.guards.length; i++) G.guards[i].draw(ctx, time);
};

// ═══════════════ 进攻无人机系统（单击发射键出击：自动攻击直到弹药耗尽返航补给） ═══════════════
G.StrikerDrone = class StrikerDrone {
  constructor() {
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.radius = 9; this.angle = 0;
    this.alive = false; this.hp = 10; this.maxHp = 10; // 默认停泊母舰内，单击发射键出击
    this.respawnTimer = 0; this.fireCooldown = 0; this.invincible = 0;
    this.state = 'seek';        // seek(索敌) / charge(冲锋) / return(返航)
    this.chargeTimer = 0; this.chargeAngle = 0;
    this.roundsLeft = 2;        // 每次出击冲锋两轮，打完返航补给
    this.evadeTimer = 0; this.evadeCd = 0; // 规避：持续1秒无敌，结束后冷却1秒
    this.phase = Math.random() * G.TWO_PI;
  }

  spawn(player) {
    this.x = player.x + (G.RAND() - 0.5) * 40;
    this.y = player.y + (G.RAND() - 0.5) * 40;
    this.vx = 0; this.vy = 0;
    this.maxHp = Math.max(5, Math.ceil(player.maxHp * 0.05)); // 血量=母船5%（与普通无人机一致）
    this.hp = this.maxHp;
    this.alive = true; this.respawnTimer = 0; this.invincible = 1;
    this.state = 'seek'; this.chargeTimer = 0; this.roundsLeft = 2;
    this.evadeTimer = 0; this.evadeCd = 0;
    G.particles.explosion(this.x, this.y, '#f84', 20);
  }

  takeDamage(amount) {
    if (!this.alive || this.invincible > 0) return;
    // 非冲锋时的主动规避：就绪时免伤闪避1秒
    if (this.state !== 'charge' && this.evadeTimer <= 0 && this.evadeCd <= 0) {
      this.evadeTimer = 1; this.invincible = 1;
      G.particles.explosion(this.x, this.y, '#fc8', 14);
      return;
    }
    this.hp -= amount; this.invincible = 0.8;
    if (this.hp <= 0) {
      this.alive = false; this.respawnTimer = 5; // 死亡后5秒由母船体内重生
      G.particles.explosion(this.x, this.y, '#f84', 24);
    }
  }

  update(dt, player, input) {
    if (!this.alive) {
      // 停泊/补给中：单击发射键（鼠标点击/空格）出击，无需按住
      if (this.respawnTimer > 0) this.respawnTimer -= dt;
      const firePressed = input.mouse.justDown || input.justPressed('Space');
      if (this.respawnTimer <= 0 && player && player.alive && firePressed) this.spawn(player);
      return;
    }
    if (this.invincible > 0) this.invincible -= dt;
    if (this.fireCooldown > 0) this.fireCooldown -= dt;
    if (this.evadeCd > 0) this.evadeCd -= dt;
    this.phase += dt * 10;

    // ── 冲锋状态：沿锁定方向高速突进+连射，全程自动规避（无敌） ──
    if (this.state === 'charge') {
      this.chargeTimer -= dt;
      this.invincible = Math.max(this.invincible, 0.1); // 冲锋自动规避伤害
      const spd = 360; // 移速减半
      this.vx = Math.cos(this.chargeAngle) * spd;
      this.vy = Math.sin(this.chargeAngle) * spd;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.angle = this.chargeAngle;
      // 冲锋期间连射母船子弹（总射速与母船一致：单机间隔 = 机数 / 射速）
      const w = G.weaponSystem && G.weaponSystem.weapon;
      if (w && this.fireCooldown <= 0) {
        G.weaponSystem.fireVolley(this.x + Math.cos(this.chargeAngle) * 10, this.y + Math.sin(this.chargeAngle) * 10, this.chargeAngle, null);
        const n = Math.max(1, w.strikerCount || 1);
        this.fireCooldown = n / w.fireRate / (G.hasGene('swarm') ? 1.3 : 1);
      }
      if (this.chargeTimer <= 0) {
        this.roundsLeft--;
        this.state = this.roundsLeft > 0 ? 'seek' : 'return'; // 两轮打完返航补给
      }
      this.x = G.clamp(this.x, this.radius, G.renderer.width - this.radius);
      this.y = G.clamp(this.y, this.radius, G.renderer.height - this.radius);
      return;
    }

    // ── 返航状态：弹药耗尽飞回母舰入坞补给，等待下次发射指令 ──
    if (this.state === 'return') {
      if (player && player.alive) {
        const rd = G.dist(this.x, this.y, player.x, player.y);
        if (rd < 24) {
          this.alive = false;
          this.respawnTimer = 3; // 入坞补给3秒，之后停泊等待下次单击出击
          G.particles.explosion(this.x, this.y, '#fc8', 16);
          return;
        }
        const a = G.angle(this.x, this.y, player.x, player.y);
        this.vx = Math.cos(a) * 350; this.vy = Math.sin(a) * 350; // 移速减半
        this.angle = a;
      } else { this.vx *= 0.9; this.vy *= 0.9; }
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.x = G.clamp(this.x, this.radius, G.renderer.width - this.radius);
      this.y = G.clamp(this.y, this.radius, G.renderer.height - this.radius);
      return;
    }

    // ── 规避状态（非冲锋受击触发）：1秒无敌闪避 ──
    if (this.evadeTimer > 0) {
      this.evadeTimer -= dt;
      this.invincible = Math.max(this.invincible, 0.1);
      if (this.evadeTimer <= 0) this.evadeCd = 1; // 规避结束进入1秒冷却（期间正常受伤）
    }

    // 移动：按住左键朝准星移动（与普通无人机一致，移速减半）
    const dx = input.mouse.x - this.x, dy = input.mouse.y - this.y;
    const d = Math.hypot(dx, dy);
    if (input.shooting && d > 24) {
      this.vx = G.lerp(this.vx, (dx / d) * 350, 6 * dt);
      this.vy = G.lerp(this.vy, (dy / d) * 350, 6 * dt);
    } else if (this.state === 'seek') {
      // 索敌：飞向离母船最近的目标，进入射程发起冲锋
      const t = this.findTarget(player);
      if (t) {
        const td = G.dist(this.x, this.y, t.x, t.y);
        if (td < 340) {
          this.state = 'charge'; this.chargeTimer = 1;
          this.chargeAngle = G.angle(this.x, this.y, t.x, t.y);
          this.fireCooldown = 0;
          this.vx = 0; this.vy = 0;
        } else {
          const a = G.angle(this.x, this.y, t.x, t.y);
          this.vx = G.lerp(this.vx, Math.cos(a) * 160, 4 * dt); // 移速减半
          this.vy = G.lerp(this.vy, Math.sin(a) * 160, 4 * dt);
          this.angle = a;
        }
      } else { this.vx *= 0.9; this.vy *= 0.9; }
    } else { this.vx *= 0.9; this.vy *= 0.9; }
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.x = G.clamp(this.x, this.radius, G.renderer.width - this.radius);
    this.y = G.clamp(this.y, this.radius, G.renderer.height - this.radius);
    const spd = Math.hypot(this.vx, this.vy);
    if (spd > 40) this.angle = Math.atan2(this.vy, this.vx);
  }

  // 索敌：离母船最近的敌人
  findTarget(player) {
    if (!player) return null;
    let target = null, nd = Infinity;
    const act = G.enemyPool.active;
    for (let i = 0; i < act.length; i++) {
      const e = act[i];
      if (!e.alive || e.charmed || e.phaseShift > 0) continue;
      const dist = G.dist(player.x, player.y, e.x, e.y);
      if (dist < nd) { nd = dist; target = e; }
    }
    return target;
  }

  draw(ctx, time) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    if (this.invincible > 0 && Math.sin(time * 30) > 0) ctx.globalAlpha = 0.4;
    // 冲锋尾焰
    if (this.state === 'charge') {
      ctx.fillStyle = `rgba(255,140,60,${0.5 + 0.3 * Math.sin(this.phase)})`;
      ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-16, -3); ctx.lineTo(-16, 3); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = `rgba(255,170,90,${0.4 + 0.3 * Math.sin(this.phase)})`;
      ctx.beginPath(); ctx.arc(-8, 0, 2.5, 0, G.TWO_PI); ctx.fill();
    }
    // 机体：前掠箭形
    ctx.shadowColor = '#f84'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#fc9';
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-4, -7); ctx.lineTo(-7, 0); ctx.lineTo(-4, 7); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    // 血条
    if (this.hp < this.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(this.x - 8, this.y - this.radius - 6, 16, 2);
      ctx.fillStyle = '#f84'; ctx.fillRect(this.x - 8, this.y - this.radius - 6, 16 * Math.max(0, this.hp / this.maxHp), 2);
    }
  }
};

// 进攻无人机管理：数量与加点同步（默认停泊母舰内，按住发射键出击）
G.strikers = [];
G.syncStrikers = function(count) {
  while (G.strikers.length > count) G.strikers.pop();
  while (G.strikers.length < count) G.strikers.push(new G.StrikerDrone());
};
G.updateStrikers = function(dt) {
  for (let i = 0; i < G.strikers.length; i++) G.strikers[i].update(dt, G.player, G.input);
};
G.drawStrikers = function(ctx, time) {
  for (let i = 0; i < G.strikers.length; i++) G.strikers[i].draw(ctx, time);
};

// ═══════════════ 敌人系统 ═══════════════
// ═══════════════ 基因掠夺系统（封印完成后触发） ═══════════════
G.geneBuffs = {};   // trait → 剩余秒数
G.genePhaseTimer = 0;
G.geneNestTimer = 0; // 繁育基因：召唤友军 minion 计时

// 基因可视化元数据（图标/配色沿用对应敌人）
G.GeneMeta = {
  normal:    { icon: 'gene', color: '#adf' },
  tank:      { icon: 'hull', color: '#f44' },
  fast:      { icon: 'fast', color: '#fa4' },
  healer:    { icon: 'regen', color: '#4f4' },
  splitter:  { icon: 'split', color: '#d4d' },
  shielded:  { icon: 'shield', color: '#48f' },
  explosive: { icon: 'burn', color: '#f80' },
  teleporter:{ icon: 'teleporter', color: '#a4f' },
  phaser:    { icon: 'phaser', color: '#8af' },
  reflector: { icon: 'reflect', color: '#fc8' },
  swarm:     { icon: 'swarm', color: '#f66' },
  reviver:   { icon: 'reviver', color: '#2cc' },
  bubble:    { icon: 'bubble', color: '#6ef' },
  timelurker:{ icon: 'timelurker', color: '#b8f' },
  nest:      { icon: 'nest', color: '#9a5' },
};

G.hasGene = trait => (G.geneBuffs[trait] || 0) > 0;

G.gainGene = function(trait, duration, x, y) {
  G.geneBuffs[trait] = duration; // 重复获取刷新持续时间
  if (trait === 'phaser') G.genePhaseTimer = 0;
  if (trait === 'nest') G.geneNestTimer = 2; // 繁育基因：首次召唤加速
  if (trait === 'shielded' && G.player && G.player.alive) G.player.shield += 60; // 护盾基因：立即获得60护盾
  G.events.emit('gene:gained', { trait, duration, x, y });
};

G.geneUpdate = function(dt) {
  for (const t in G.geneBuffs) {
    G.geneBuffs[t] -= dt;
    if (G.geneBuffs[t] <= 0) delete G.geneBuffs[t];
  }
  // 相位基因：每3秒进入相位无敌1秒
  if (G.hasGene('phaser') && G.player && G.player.alive) {
    G.genePhaseTimer -= dt;
    if (G.genePhaseTimer <= 0) {
      G.player.invincible = Math.max(G.player.invincible, 1);
      G.genePhaseTimer = 3;
    }
  }
  // 繁育基因（育母之巢）：每8秒从玩家体内召唤一个魅惑 minion
  if (G.hasGene('nest') && G.player && G.player.alive && G.enemyPool) {
    G.geneNestTimer -= dt;
    if (G.geneNestTimer <= 0) {
      G.geneNestTimer = 8;
      const m = G.enemyPool.get();
      m.init(G.EnemyType.NORMAL,
        G.player.x + (Math.random() - 0.5) * 80, G.player.y + (Math.random() - 0.5) * 80,
        (G.gameData && G.gameData.wave) || 1);
      m.convertToAlly(5);
      G.particles.explosion(m.x, m.y, '#6f8', 20);
    }
  }
};

G.clearGenes = function() { G.geneBuffs = {}; G.genePhaseTimer = 0; G.geneNestTimer = 0; };

G.EnemyType = {
  NORMAL: 'normal', TANK: 'tank', FAST: 'fast', HEALER: 'healer',
  SPLITTER: 'splitter', SHIELDED: 'shielded', EXPLOSIVE: 'explosive',
  TELEPORTER: 'teleporter', BOSS: 'boss',
  PHASER: 'phaser', REFLECTOR: 'reflector', SWARM: 'swarm',
  REVIVER: 'reviver', BUBBLE: 'bubble', TIMELURKER: 'timelurker',
  NEST: 'nest',
};

G.Enemy = class Enemy {
  constructor() { this.reset(); }

  reset() {
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.radius = 20; this.hp = 10; this.maxHp = 10;
    this.type = G.EnemyType.NORMAL; this.speed = 60; this.alive = false;
    this.color = '#f44'; this.glowColor = 'rgba(255,60,60,0.4)';
    this.phase = Math.random() * G.TWO_PI; this.frozen = 0;
    this.freezeStack = 0; this.shockTimer = 0; // 冰冻叠加值(=减速%) / 感电减速计时
    this.shield = 0; this.shieldMax = 0; this.healRate = 0;
    this.splitCount = 0; this.teleportCooldown = 0;
    this.scoreValue = 10; this.hitFlash = 0; this.traits = [];
    this.spawnAnim = 1; this.facingAngle = 0;
    // 新机制
    this.phaseShift = 0; this.phaseShiftCooldown = 0;
    this.dotDamage = 0; this.dotTimer = 0;
    this.burnDps = 0; this.burnTimer = 0; this.burnAge = 0; // 燃烧（伤害随时间递增）
    this.elementState = null; this.elementTimer = 0;
    this.elite = null; // { type: 'speed'|'shield'|'aura', ... }
    // 新敌人机制
    this.revived = false; this.reviving = false; // 复活者
    this.vulnMult = 1; this.baseRadius = 20; // 泡泡
    this.timeAccum = 0; this.timeTick = 0; // 时间溜脱者
    this.sealAccum = 0; this.charmAccum = 0; // 封印/魅惑累计
    this.superAccum = 0; this.superTimer = 0; this.superGeneTime = 0; // 魅惑+封印叠加态
    this.absorbed = false; // 封印吸收标记：跳过死亡触发的分裂/自爆
    this.charmed = false; this.allyHitCd = 0; this.charmLife = 0; // 魅惑友军
    this.spawnTimer = 0; // 育母之巢召唤计时
  }

  init(type, x, y, wave, elite) {
    this.x = x; this.y = y; this.type = type;
    this.phase = Math.random() * G.TWO_PI;
    this.spawnAnim = 1; this.frozen = 0; this.hitFlash = 0;
    this.freezeStack = 0; this.shockTimer = 0;
    this.traits = []; this.alive = true;
    this.phaseShift = 0; this.phaseShiftCooldown = 3 + Math.random()*2;
    this.dotDamage = 0; this.dotTimer = 0;
    this.burnDps = 0; this.burnTimer = 0; this.burnAge = 0;
    this.elementState = null; this.elementTimer = 0;
    this.elite = elite || null;
    this.revived = false; this.reviving = false;
    this.vulnMult = 1; this.timeAccum = 0; this.timeTick = 0;
    this.sealAccum = 0; this.charmAccum = 0;
    this.superAccum = 0; this.superTimer = 0; this.superGeneTime = 0;
    this.absorbed = false;
    this.charmed = false; this.allyHitCd = 0; this.charmLife = 0;
    this.spawnTimer = 0;

    const w = wave || 1;
    const scale = 1 + (w - 1) * 0.15;

    switch (type) {
      case G.EnemyType.NORMAL:
        this.radius = 18; this.maxHp = this.hp = Math.floor(30*scale);
        this.speed = 50+w*3; this.color = '#e55'; this.glowColor = 'rgba(230,80,80,0.4)';
        this.scoreValue = 10; break;
      case G.EnemyType.TANK:
        this.radius = 30; this.maxHp = this.hp = Math.floor(160*scale);
        this.speed = 25+w; this.color = '#a44'; this.glowColor = 'rgba(180,60,60,0.5)';
        this.scoreValue = 30; this.traits.push('tank'); break;
      case G.EnemyType.FAST:
        this.radius = 14; this.maxHp = this.hp = Math.floor(16*scale);
        this.speed = 140+w*8; this.color = '#fa4'; this.glowColor = 'rgba(255,170,60,0.4)';
        this.scoreValue = 15; this.traits.push('fast'); break;
      case G.EnemyType.HEALER:
        this.radius = 22; this.maxHp = this.hp = Math.floor(50*scale);
        this.speed = 35; this.healRate = 10+w*1;
        this.color = '#4d4'; this.glowColor = 'rgba(60,220,60,0.4)';
        this.scoreValue = 25; this.traits.push('healer'); break;
      case G.EnemyType.SPLITTER:
        this.radius = 24; this.maxHp = this.hp = Math.floor(60*scale);
        this.speed = 40+w*2; this.splitCount = 3;
        this.color = '#d4d'; this.glowColor = 'rgba(220,60,220,0.4)';
        this.scoreValue = 20; this.traits.push('splitter'); break;
      case G.EnemyType.SHIELDED:
        this.radius = 20; this.maxHp = this.hp = Math.floor(40*scale);
        this.shieldMax = this.shield = Math.floor(60*scale); this.speed = 45;
        this.color = '#48f'; this.glowColor = 'rgba(60,130,255,0.4)';
        this.scoreValue = 25; this.traits.push('shielded'); break;
      case G.EnemyType.EXPLOSIVE:
        this.radius = 16; this.maxHp = this.hp = Math.floor(20*scale);
        this.speed = 80+w*4; this.color = '#f80'; this.glowColor = 'rgba(255,140,0,0.5)';
        this.scoreValue = 15; this.traits.push('explosive'); break;
      case G.EnemyType.TELEPORTER:
        this.radius = 16; this.maxHp = this.hp = Math.floor(24*scale);
        this.speed = 60; this.teleportCooldown = 2;
        this.color = '#a4f'; this.glowColor = 'rgba(170,70,255,0.4)';
        this.scoreValue = 20; this.traits.push('teleporter'); break;
      case G.EnemyType.PHASER:
        this.radius = 18; this.maxHp = this.hp = Math.floor(44*scale);
        this.speed = 55; this.color = '#8af'; this.glowColor = 'rgba(130,170,255,0.5)';
        this.scoreValue = 25; this.traits.push('phaser'); break;
      case G.EnemyType.REFLECTOR:
        this.radius = 22; this.maxHp = this.hp = Math.floor(70*scale);
        this.speed = 40; this.color = '#fc8'; this.glowColor = 'rgba(255,200,130,0.4)';
        this.scoreValue = 30; this.traits.push('reflector'); break;
      case G.EnemyType.SWARM:
        this.radius = 10; this.maxHp = this.hp = Math.floor(6*scale);
        this.speed = 100+w*5; this.color = '#f66'; this.glowColor = 'rgba(255,100,100,0.5)';
        this.scoreValue = 5; this.traits.push('swarm'); break;
      case G.EnemyType.REVIVER:
        this.radius = 24; this.maxHp = this.hp = Math.floor(60*scale);
        this.speed = 45; this.color = '#2cc'; this.glowColor = 'rgba(40,200,200,0.4)';
        this.scoreValue = 35; this.traits.push('reviver'); break;
      case G.EnemyType.BUBBLE:
        this.radius = 16; this.maxHp = this.hp = Math.floor(40*scale);
        this.baseRadius = 16; this.speed = 55+w*3;
        this.color = '#6ef'; this.glowColor = 'rgba(100,240,255,0.4)';
        this.scoreValue = 20; this.traits.push('bubble'); break;
      case G.EnemyType.TIMELURKER:
        this.radius = 22; this.maxHp = this.hp = Math.floor(50*scale);
        this.speed = 40; this.color = '#b8f'; this.glowColor = 'rgba(180,130,255,0.5)';
        this.scoreValue = 30; this.traits.push('timelurker'); break;
      case G.EnemyType.NEST:
        this.radius = 42; this.maxHp = this.hp = Math.floor(500*scale);
        this.speed = 0; this.spawnTimer = 3; // 育母之巢：无法移动，首次召唤3秒后
        this.color = '#9a5'; this.glowColor = 'rgba(150,200,80,0.5)';
        this.scoreValue = 120; this.traits.push('nest'); break;
      case G.EnemyType.BOSS:
        this.radius = 50; this.maxHp = this.hp = Math.floor(1000*scale);
        this.speed = 20; this.color = '#f22'; this.glowColor = 'rgba(255,30,30,0.6)';
        this.scoreValue = 200; this.healRate = 4;
        this.traits.push('boss','tank'); break;
    }

    // 精英词缀增强
    if (this.elite) {
      switch (this.elite.type) {
        case 'speed': this.speed *= 1.8; this.color = '#ff4'; this.scoreValue *= 2; break;
        case 'shield': this.shieldMax = this.shield = this.maxHp * 0.5; this.scoreValue *= 2; break;
        case 'aura': this.color = '#f8f'; this.scoreValue *= 2; break;
      }
    }
  }

  applyDOT(dps, duration) {
    this.dotDamage = Math.max(this.dotDamage, dps);
    this.dotTimer = Math.max(this.dotTimer, duration);
  }

  // 燃烧：伤害随燃烧时长增长（每秒+100%，最高6倍）；重复命中只刷新时长，伤害不叠加
  applyBurn(dps, duration) {
    if (!this.alive) return;
    if (this.burnTimer <= 0) { this.burnAge = 0; this.burnDps = dps; }
    else this.burnDps = Math.max(this.burnDps, dps);
    this.burnTimer = Math.max(this.burnTimer, duration);
  }

  applyElement(effect) {
    this.elementState = effect; this.elementTimer = 3;
    if (effect === 'burn') this.applyBurn(8, 3);
  }

  // 冰冻叠加：叠加值=减速百分比，每秒自动-10%，满100%冰冻2秒并清零
  applyFreeze(amount) {
    if (!this.alive || this.frozen > 0) return;
    this.freezeStack = Math.min(100, this.freezeStack + amount);
    this.elementState = 'freeze'; this.elementTimer = 3;
    if (this.freezeStack >= 100) {
      this.freezeStack = 0;
      this.frozen = 2;
      G.particles.freezeBurst(this.x, this.y);
    }
  }

  // 感电：3秒减速50%（重复施加仅刷新时长，不叠加）
  applyShock() {
    if (!this.alive) return;
    this.shockTimer = 3;
    this.elementState = 'shock'; this.elementTimer = 3;
  }

  update(dt, playerX, playerY, events, enemies) {
    this.spawnAnim = Math.max(0, this.spawnAnim - dt * 3);
    this.hitFlash = Math.max(0, this.hitFlash - dt * 8);
    this.phase += dt * 3;

    // 魅惑友军：仅切换攻击冷却计数，其余机制/技能照常运行（下方统一处理追击目标）
    if (this.charmed) this.allyHitCd = Math.max(0, this.allyHitCd - dt);

    // 叠加态临时魅惑倒计时：到期后封印吸收并夺取基因
    if (this.superTimer > 0) {
      this.superTimer -= dt;
      if (this.superTimer <= 0 && this.alive) {
        const trait = this.traits[0] || 'normal';
        this.charmed = false;
        this.absorb(events); // 封印吸收：静默击杀
        G.particles.explosion(this.x, this.y, '#a6f', this.radius * 1.5);
        G.gainGene(trait, this.superGeneTime, this.x, this.y);
        return;
      }
    }

    // 育母之巢：每5秒不停召唤敌人（被魅惑后召唤友军后代）
    if (this.traits.includes('nest')) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        this.spawnTimer = 5;
        events.emit('nest:spawn', { enemy: this });
      }
    }

    // 复活者：复活中无法行动，快速回血，回满恢复行动
    if (this.reviving) {
      this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.25 * dt);
      if (this.hp >= this.maxHp) {
        this.reviving = false;
        this.speed *= 1.3; // 复活后狂暴加速
        events.emit('enemy:revive', { enemy: this });
      }
      return;
    }

    // 时间溜脱者：累计伤害池按每秒10%释放
    if (this.traits.includes('timelurker') && this.timeAccum > 0) {
      this.timeTick += dt;
      if (this.timeTick >= 1) {
        this.timeTick = 0;
        const drain = this.timeAccum * 0.1;
        this.timeAccum -= drain;
        this.hp -= drain;
        this.hitFlash = 1;
        if (this.hp <= 0) { this.alive = false; events.emit('enemy:death', { enemy: this }); return; }
      }
    }

    // 元素状态衰减
    if (this.elementTimer > 0) this.elementTimer -= dt;
    if (this.shockTimer > 0) this.shockTimer -= dt;
    if (this.freezeStack > 0 && this.frozen <= 0) this.freezeStack = Math.max(0, this.freezeStack - 10 * dt); // 冰冻值每秒-10%

    if (this.frozen > 0) { this.frozen -= dt; return; }

    // 相位移动（PHASER型 & BOSS定期）
    if (this.traits.includes('phaser') || this.traits.includes('boss')) {
      this.phaseShiftCooldown -= dt;
      if (this.phaseShiftCooldown <= 0 && this.phaseShift <= 0) {
        this.phaseShift = 2.5; // 持续2.5秒
        this.phaseShiftCooldown = 6 + Math.random()*4;
      }
    }
    if (this.phaseShift > 0) { this.phaseShift -= dt; }

    // 自愈
    if (this.healRate > 0 && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.healRate * dt);

    // 精英光环：给附近敌人加速
    if (this.elite && this.elite.type === 'aura') {
      // aura effect handled in wave manager or main loop
    }

    // 传送者
    if (this.traits.includes('teleporter')) {
      this.teleportCooldown -= dt;
      if (this.teleportCooldown <= 0) {
        this.teleportCooldown = G.randFloat(2, 4);
        const a = G.randFloat(0, G.TWO_PI), d = G.randFloat(80, 200);
        this.x = G.clamp(this.x+Math.cos(a)*d, this.radius, G.renderer.width-this.radius);
        this.y = G.clamp(this.y+Math.sin(a)*d, this.radius, G.renderer.height-this.radius);
        events.emit('enemy:teleport', { enemy: this });
      }
    }

    // 追击目标：魅惑追最近敌人，否则追玩家
    let tx = playerX, ty = playerY, hasTarget = true;
    if (this.charmed) {
      let target = null, nd = Infinity;
      if (enemies) for (let i = 0; i < enemies.length; i++) {
        const o = enemies[i];
        if (!o.alive || o.charmed || o === this || o.reviving) continue;
        const d = G.dist(this.x, this.y, o.x, o.y);
        if (d < nd) { nd = d; target = o; }
      }
      if (!target) hasTarget = false;
      else { tx = target.x; ty = target.y; }
    }

    const dx = tx - this.x, dy = ty - this.y;
    const dist = Math.hypot(dx, dy);

    // 朝向
    if (hasTarget) this.facingAngle = Math.atan2(dy, dx);

    // 相位中速度减半；时滞基因：玩家附近160px内非友军敌人再减速50%；感电-50%；冰冻叠加值=减速%
    let spdMul = this.phaseShift > 0 ? 0.5 : 1;
    if (this.shockTimer > 0) spdMul *= 0.5;
    if (this.freezeStack > 0) spdMul *= 1 - this.freezeStack / 100;
    if (!this.charmed && G.hasGene('timelurker') && G.player &&
        G.dist(this.x, this.y, G.player.x, G.player.y) < 160) spdMul *= 0.5;

    if (!hasTarget) {
      this.vx = 0; this.vy = 0;
    } else if (this.traits.includes('fast')) {
      const zigzag = Math.sin(this.phase*3)*60;
      const ang = Math.atan2(dy, dx), perpAng = ang + Math.PI/2;
      this.vx = Math.cos(ang)*this.speed*spdMul + Math.cos(perpAng)*zigzag;
      this.vy = Math.sin(ang)*this.speed*spdMul + Math.sin(perpAng)*zigzag;
    } else if (this.traits.includes('boss')) {
      const orbitAng = Math.atan2(dy, dx) + Math.sin(this.phase*0.5)*0.8;
      this.vx = Math.cos(orbitAng)*this.speed*spdMul;
      this.vy = Math.sin(orbitAng)*this.speed*spdMul;
    } else if (this.traits.includes('swarm')) {
      // 蜂群：直线冲撞
      if (dist > 0) {
        this.vx = (dx/dist)*this.speed*spdMul*1.2;
        this.vy = (dy/dist)*this.speed*spdMul*1.2;
      }
    } else {
      if (dist > 0) {
        this.vx = G.lerp(this.vx, (dx/dist)*this.speed*spdMul, 2*dt);
        this.vy = G.lerp(this.vy, (dy/dist)*this.speed*spdMul, 2*dt);
      }
    }

    this.x += this.vx * dt; this.y += this.vy * dt;
    this.x = G.clamp(this.x, this.radius, G.renderer.width - this.radius);
    this.y = G.clamp(this.y, this.radius, G.renderer.height - this.radius);
  }

  takeDamage(amount, events, fromEnemy = false) {
    // 魅惑友军：仅免疫玩家伤害；敌方攻击按正常特质处理（护盾/泡泡/时间溜脱/复活等机制照常生效）
    if (this.charmed && !fromEnemy) return false;
    // 泡泡：每次受击变大10%、受到伤害增加10%
    if (this.traits.includes('bubble')) {
      amount *= this.vulnMult;
      this.bubbleGrow();
    }
    if (this.shield > 0) {
      const absorbed = Math.min(this.shield, amount);
      this.shield -= absorbed; amount -= absorbed;
      if (absorbed > 0) events.emit('enemy:shieldHit', { enemy: this, absorbed });
    }
    if (amount <= 0) return false;
    // 时间溜脱者：伤害进入累计池，按每秒10%释放
    if (this.traits.includes('timelurker')) {
      this.timeAccum += amount;
      this.hitFlash = 1;
      events.emit('enemy:hit', { enemy: this, damage: amount });
      return false;
    }
    this.hp -= amount; this.hitFlash = 1;
    events.emit('enemy:hit', { enemy: this, damage: amount });
    if (this.hp <= 0) {
      // 复活者：第一次死亡后最大生命值翻倍，进入复活状态
      if (this.traits.includes('reviver') && !this.revived) {
        this.revived = true; this.reviving = true;
        this.maxHp *= 2;
        this.hp = Math.max(1, this.maxHp * 0.15);
        events.emit('enemy:downed', { enemy: this });
        return false;
      }
      this.alive = false; events.emit('enemy:death', { enemy: this }); return true;
    }
    return false;
  }

  // 泡泡变大：受击体积+10%、受伤+10%、分数+5%（普通/魅惑/封印命中均触发）
  bubbleGrow() {
    if (!this.traits.includes('bubble')) return;
    this.vulnMult = Math.min(3, this.vulnMult * 1.1);
    if (this.radius < this.baseRadius * 3) {
      this.radius = Math.min(this.baseRadius * 3, this.radius * 1.1);
      this.scoreValue = Math.floor(this.scoreValue * 1.05);
    }
  }

  // 魅惑转化：成为玩家友军（永久存在，Boss也可被魅惑；数据保持原样）
  // regen：魅惑加点提供的每秒回血（每点+1），叠加在原healRate上
  convertToAlly(regen = 0) {
    this.charmed = true;
    this.color = '#6f8'; this.glowColor = 'rgba(100,255,140,0.5)';
    this.sealAccum = 0; this.charmAccum = 0; this.superAccum = 0;
    if (regen > 0) this.healRate += regen;
  }

  // 封印吸收：强制静默击杀（绕过时间溜脱伤害池/复活者重生/死亡自爆与分裂），用于封印满值与叠加态到期
  absorb(events) {
    if (!this.alive) return;
    this.absorbed = true;
    this.hp = 0; this.alive = false;
    events.emit('enemy:death', { enemy: this });
  }

  draw(ctx, time) {
    const scale = 1 - this.spawnAnim * 0.5;
    const alpha = 1 - this.spawnAnim;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;

    // 相位效果：半透明+闪烁
    if (this.phaseShift > 0) {
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(time * 12);
    }

    // 精英光环
    if (this.elite) {
      const eColor = this.elite.type==='speed'?'#ff4':this.elite.type==='shield'?'#4af':'#f4f';
      ctx.strokeStyle = eColor; ctx.lineWidth = 2;
      ctx.globalAlpha = 0.4 + 0.2*Math.sin(time*5);
      ctx.beginPath(); ctx.arc(0,0,this.radius+10,0,G.TWO_PI); ctx.stroke();
      ctx.globalAlpha = alpha;
    }

    // 主体球
    const grad = ctx.createRadialGradient(-this.radius*0.2,-this.radius*0.2,this.radius*0.1,0,0,this.radius);
    const baseColor = this.hitFlash > 0.5 ? '#fff' : this.color;
    grad.addColorStop(0, baseColor); grad.addColorStop(0.7, this.color); grad.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0,this.radius,0,G.TWO_PI); ctx.fill();

    // 育母之巢：外层脉动卵囊
    if (this.traits.includes('nest')) {
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * G.TWO_PI + time * 0.4;
        const er = this.radius * 0.3 + Math.sin(time * 2 + i) * 3;
        ctx.fillStyle = `rgba(190,240,120,${0.35 + 0.2 * Math.sin(time * 3 + i)})`;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * this.radius * 0.65, Math.sin(a) * this.radius * 0.65, er, 0, G.TWO_PI);
        ctx.fill();
      }
      // 召唤进度环
      const sp = 1 - Math.max(0, this.spawnTimer) / 5;
      ctx.strokeStyle = 'rgba(190,240,120,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 6, -Math.PI/2, -Math.PI/2 + G.TWO_PI * sp); ctx.stroke();
    }

    // 反射者：正面盾牌指示
    if (this.traits.includes('reflector')) {
      ctx.save(); ctx.rotate(this.facingAngle);
      ctx.strokeStyle = 'rgba(255,220,100,0.7)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,0,this.radius+3,-0.7,0.7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,220,100,0.2)';
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,this.radius+3,-0.7,0.7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // 护盾环
    if (this.shield > 0) {
      const sr = this.shield/this.shieldMax;
      ctx.strokeStyle = `rgba(80,160,255,${0.4+sr*0.4})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0,0,this.radius+5,0,G.TWO_PI*sr); ctx.stroke();
    }
    // 自愈光环
    if (this.healRate > 0) {
      ctx.strokeStyle = `rgba(80,255,80,${0.2+0.1*Math.sin(time*4)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,this.radius+3+Math.sin(time*2)*3,0,G.TWO_PI); ctx.stroke();
    }

    // 慢性毒药（绿环）
    if (this.dotTimer > 0) {
      ctx.strokeStyle = `rgba(130,230,70,${0.45+0.25*Math.sin(time*6)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,this.radius+1,0,G.TWO_PI); ctx.stroke();
    }
    // 燃烧（橙环随燃烧时长变亮）
    if (this.burnTimer > 0) {
      const bm = Math.min(6, 1 + this.burnAge) / 6;
      ctx.strokeStyle = `rgba(255,110,20,${0.3 + 0.5 * bm})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0,0,this.radius+1.5,0,G.TWO_PI); ctx.stroke();
    }
    // 元素标记
    if (this.elementState) {
      const ec = this.elementState==='burn'?'#f80':this.elementState==='freeze'?'#8df':'#ff0';
      ctx.strokeStyle = ec; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0,0,this.radius+6,0,G.TWO_PI*(this.elementTimer/3)); ctx.stroke();
    }
    // 冰冻叠加进度环（叠加值=减速%）
    if (this.freezeStack > 0) {
      ctx.strokeStyle = '#8df'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0,0,this.radius+3,-Math.PI/2,-Math.PI/2 + G.TWO_PI*(this.freezeStack/100)); ctx.stroke();
    }
    // 感电电弧抖动
    if (this.shockTimer > 0) {
      ctx.strokeStyle = 'rgba(255,255,80,0.8)'; ctx.lineWidth = 1;
      for (let i = 0; i < 2; i++) {
        const a1 = Math.random()*G.TWO_PI;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a1)*this.radius, Math.sin(a1)*this.radius);
        ctx.lineTo(Math.cos(a1)*(this.radius+4)+(Math.random()-0.5)*6, Math.sin(a1)*(this.radius+4)+(Math.random()-0.5)*6);
        ctx.stroke();
      }
    }
    // 封印累计：紫色进度环+百分比
    if (this.sealAccum > 0) {
      const p = Math.min(1, this.sealAccum / this.maxHp);
      ctx.strokeStyle = '#a6f'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 9, -Math.PI/2, -Math.PI/2 + G.TWO_PI * p); ctx.stroke();
      ctx.fillStyle = '#a6f'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(Math.floor(p * 100) + '%', 0, -this.radius - 14);
    }
    // 魅惑累计：粉色进度环
    if (this.charmAccum > 0 && !this.charmed) {
      const p = Math.min(1, this.charmAccum / this.maxHp);
      ctx.strokeStyle = '#f6c'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 9, -Math.PI/2, -Math.PI/2 + G.TWO_PI * p); ctx.stroke();
    }
    // 叠加态累计：粉紫双色进度环
    if (this.superAccum > 0 && !this.charmed) {
      const p = Math.min(1, this.superAccum / this.maxHp);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#f6c';
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 13, -Math.PI/2, -Math.PI/2 + G.TWO_PI * p); ctx.stroke();
      ctx.strokeStyle = '#a6f';
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 9, -Math.PI/2, -Math.PI/2 + G.TWO_PI * p); ctx.stroke();
    }
    // 叠加态临时魅惑倒计时
    if (this.charmed && this.superTimer > 0) {
      ctx.strokeStyle = '#a6f'; ctx.lineWidth = 2.5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 9, 0, G.TWO_PI); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#d8aff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(this.superTimer) + 's', 0, -this.radius - 14);
    }
    // 复活中：绿色脉动环
    if (this.reviving) {
      ctx.strokeStyle = `rgba(80,255,200,${0.5 + 0.3 * Math.sin(time * 10)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 6 + Math.sin(time * 6) * 3, 0, G.TWO_PI); ctx.stroke();
    }
    // 时间溜脱者：累计伤害池显示
    if (this.traits.includes('timelurker') && this.timeAccum > 0) {
      ctx.strokeStyle = 'rgba(180,130,255,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 7, 0, G.TWO_PI); ctx.stroke();
      ctx.fillStyle = '#b8f'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('⏳' + Math.ceil(this.timeAccum), 0, this.radius + 16);
    }
    // 魅惑友军标识
    if (this.charmed) {
      ctx.strokeStyle = `rgba(100,255,140,${0.5 + 0.3 * Math.sin(time * 5)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 5, 0, G.TWO_PI); ctx.stroke();
    }

    // 血量数字
    const hpText = Math.ceil(this.hp).toString();
    ctx.font = `bold ${Math.max(12,this.radius*0.7)}px 'Segoe UI',sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 4;
    ctx.fillText(hpText, 0, 0); ctx.shadowBlur = 0;

    // 血条
    if (this.hp < this.maxHp) {
      const barW = this.radius*2, barH = 3, barY = -this.radius-8;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-barW/2,barY,barW,barH);
      ctx.fillStyle = this.hp/this.maxHp > 0.3 ? '#4f4' : '#f44';
      ctx.fillRect(-barW/2,barY,barW*(this.hp/this.maxHp),barH);
    }

    // Boss尖刺
    if (this.traits.includes('boss')) {
      ctx.strokeStyle = `rgba(255,50,50,${0.4+0.3*Math.sin(time*2)})`; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*G.TWO_PI+time, r1=this.radius+4, r2=this.radius+12;
        ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
        const a2=((i+0.5)/8)*G.TWO_PI+time;
        ctx.lineTo(Math.cos(a2)*r1, Math.sin(a2)*r1);
      }
      ctx.closePath(); ctx.stroke();
    }

    if (this.frozen > 0) {
      ctx.fillStyle = 'rgba(150,220,255,0.2)';
      ctx.beginPath(); ctx.arc(0,0,this.radius+2,0,G.TWO_PI); ctx.fill();
    }
    ctx.restore();
  }
};

// ═══════════════ 子弹系统 ═══════════════
G.Bullet = class Bullet {
  constructor() { this.reset(); }

  reset() {
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.angle = 0; this.speed = 600; this.damage = 10; this.radius = 3;
    this.penetration = 0; this.pierceCount = 0; this.homing = 0;
    this.aoe = 0; this.split = 0; this.alive = false;
    this.life = 0; this.maxLife = 3;
    this.color = '#4af'; this.trailColor = 'rgba(68,170,255,0.3)';
    this.bulletShape = { primary: 'orb', secondary: 'orb', blend: 0, intensity: 0.5 };
    this.trail = []; this.hitEnemies = new Set();
    // 弹射
    this.bounce = false; this.bounceCount = 0; this.bounceMax = 0;
    // 新属性
    this.dot = 0; this.zoneRadius = 0; this.zoneDps = 0;
    this.burnDps = 0; this.freezePower = 0; this.shockPoints = 0;
    this.zoneTick = 0; // AOE伤害计时器
    // 特殊效果
    this.lifesteal = 0; this.knockback = 0; this.sealRatio = 0; this.charmRatio = 0;
    this.superAccumRatio = 0; this.superCharmTime = 0; this.superGeneTime = 0; // 叠加态
    this.pierceAll = false; this.isChild = false; this.owner = 'player';
  }

  init(config) {
    Object.assign(this, config);
    this.alive = true; this.life = 0; this.pierceCount = 0;
    this.trail = []; this.hitEnemies = new Set();
    this.bounceCount = 0; this.zoneTick = 0;
    this.angle = Math.atan2(this.vy, this.vx);
  }

  update(dt, enemies, events) {
    this.life += dt;
    if (this.life > this.maxLife) { this.alive = false; return; }

    // 跟踪：每帧动态选取正前方最近的敌人，不锁死单一目标（身后的敌人不会把子弹拽回头）
    if (this.homing > 0 && !this.isChild) {
      const hx = Math.cos(this.angle), hy = Math.sin(this.angle);
      let nearest = null, nearDist2 = 160000; // 400^2
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (!e.alive || e.charmed || this.hitEnemies.has(e) || e.phaseShift > 0) continue;
        const dx = e.x - this.x, dy = e.y - this.y;
        const d2 = dx*dx + dy*dy;
        if (d2 >= nearDist2) continue;
        // 只跟踪正前方半球内的目标（与飞行方向夹角<90°）
        const invD = 1 / (Math.sqrt(d2) || 1);
        if ((dx * hx + dy * hy) * invD <= 0) continue;
        nearDist2 = d2; nearest = e;
      }
      if (nearest) {
        const targetAngle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
        const diff = G.angleDiff(this.angle, targetAngle);
        this.angle += diff * this.homing * dt * 5;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
      }
    }

    this.x += this.vx * dt; this.y += this.vy * dt;

    // 边界反弹
    if (this.bounce) {
      if (this.x < 0 || this.x > G.renderer.width) {
        this.vx *= -1; this.angle = Math.atan2(this.vy, this.vx); this.bounceCount++;
        this.x = G.clamp(this.x, 0, G.renderer.width);
      }
      if (this.y < 0 || this.y > G.renderer.height) {
        this.vy *= -1; this.angle = Math.atan2(this.vy, this.vx); this.bounceCount++;
        this.y = G.clamp(this.y, 0, G.renderer.height);
      }
      if (this.bounceCount > (this.bounceMax || 5)) this.alive = false;
    } else {
      const margin = 50;
      if (this.x < -margin || this.x > G.renderer.width+margin ||
          this.y < -margin || this.y > G.renderer.height+margin) this.alive = false;
    }

    // 拖尾
    this.trail.push({ x: this.x, y: this.y, life: 0.1 });
    if (this.trail.length > 5) this.trail.shift();
    for (let i = this.trail.length - 1; i >= 0; i--) {
      this.trail[i].life -= dt;
      if (this.trail[i].life <= 0) this.trail.splice(i, 1);
    }
  }

  draw(ctx, time) {
    // 拖尾
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const alpha = (t.life / 0.1) * 0.25;
      const r = this.radius * (t.life / 0.1) * 0.6;
      ctx.globalAlpha = alpha; ctx.fillStyle = this.trailColor;
      ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, G.TWO_PI); ctx.fill();
    }
    ctx.globalAlpha = 1;
    G.drawBulletShape(ctx, this.x, this.y, this.angle, this.radius, this.bulletShape, this.color, time);
  }
};

// ═══════════════ 伤害区域 ═══════════════
G.DamageZone = class DamageZone {
  constructor(x, y, radius, dps, duration, color) {
    this.x = x; this.y = y; this.radius = radius; this.dps = dps;
    this.duration = duration; this.life = 0; this.alive = true;
    this.color = color || '#f84'; this.tickTimer = 0;
  }
  update(dt) {
    this.life += dt;
    if (this.life >= this.duration) this.alive = false;
  }
  draw(ctx, time) {
    const progress = this.life / this.duration;
    const alpha = (1 - progress) * 0.3;
    const pulse = 1 + 0.05 * Math.sin(time * 8);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = alpha * 0.4;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * pulse, 0, G.TWO_PI); ctx.fill();
    ctx.strokeStyle = this.color;
    ctx.globalAlpha = alpha * 0.8; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * pulse, 0, G.TWO_PI); ctx.stroke();
    ctx.globalAlpha = 1;
  }
};

// ═══════════════ 轨道弹 ═══════════════
G.OrbitalBullet = class OrbitalBullet {
  constructor(player, dist, angle, speed, damage, radius, color) {
    this.player = player; this.dist = dist; this.angle = angle;
    this.speed = speed; this.damage = damage; this.radius = radius;
    this.color = color; this.x = 0; this.y = 0;
    this.hitCooldown = new Map();
  }
  draw(ctx, time) {
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, G.TWO_PI); ctx.fill();
  }
};

// ═══════════════ 粒子系统 ═══════════════
G.Particle = class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.life = 0; this.maxLife = 1;
    this.radius = 2;
    this.color = '#fff';
    this.alive = false;
    this.gravity = 0;
    this.friction = 1;
    this.shrink = true;
    this.type = 'circle'; // circle, spark, ring
  }
};

G.ParticleSystem = class ParticleSystem {
  constructor(poolSize = 500) {
    this.pool = new G.Pool(
      () => new G.Particle(),
      (p) => { p.alive = false; },
      poolSize
    );
  }

  emit(x, y, config) {
    const count = config.count || 10;
    for (let i = 0; i < count; i++) {
      const p = this.pool.get();
      p.x = x + (G.RAND() - 0.5) * (config.spread || 0);
      p.y = y + (G.RAND() - 0.5) * (config.spread || 0);
      const angle = config.angle != null
        ? config.angle + (G.RAND() - 0.5) * (config.angleSpread || G.TWO_PI)
        : G.RAND() * G.TWO_PI;
      const speed = G.randFloat(config.speedMin || 50, config.speedMax || 200);
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
      p.life = 0;
      p.maxLife = G.randFloat(config.lifeMin || 0.3, config.lifeMax || 0.8);
      p.radius = G.randFloat(config.radiusMin || 1, config.radiusMax || 3);
      p.color = config.color || '#fff';
      p.gravity = config.gravity || 0;
      p.friction = config.friction || 0.98;
      p.shrink = config.shrink !== false;
      p.type = config.type || 'circle';
      p.alive = true;
    }
  }

  // 预设特效
  explosion(x, y, color = '#f84', radius = 30) {
    this.emit(x, y, {
      count: 20,
      speedMin: 80, speedMax: 250,
      lifeMin: 0.2, lifeMax: 0.6,
      radiusMin: 1, radiusMax: 4,
      color: color,
      spread: radius * 0.5,
    });
    // 火花
    this.emit(x, y, {
      count: 8,
      speedMin: 200, speedMax: 400,
      lifeMin: 0.1, lifeMax: 0.3,
      radiusMin: 0.5, radiusMax: 1.5,
      color: '#fff',
      type: 'spark',
    });
  }

  hitSpark(x, y, color = '#ff4') {
    this.emit(x, y, {
      count: 6,
      speedMin: 60, speedMax: 150,
      lifeMin: 0.1, lifeMax: 0.25,
      radiusMin: 1, radiusMax: 2.5,
      color: color,
      angleSpread: Math.PI,
    });
  }

  deathBurst(x, y, color, radius) {
    this.emit(x, y, {
      count: 30,
      speedMin: 100, speedMax: 350,
      lifeMin: 0.3, lifeMax: 0.8,
      radiusMin: 2, radiusMax: 5,
      color: color,
      spread: radius,
    });
    // 环形波
    this.emit(x, y, {
      count: 16,
      speedMin: 150, speedMax: 200,
      lifeMin: 0.3, lifeMax: 0.5,
      radiusMin: 1, radiusMax: 2,
      color: '#fff',
      type: 'ring',
    });
  }

  freezeBurst(x, y) {
    this.emit(x, y, {
      count: 12,
      speedMin: 40, speedMax: 120,
      lifeMin: 0.3, lifeMax: 0.6,
      radiusMin: 1, radiusMax: 3,
      color: '#8df',
      spread: 10,
    });
  }

  // 闪电链视觉：两点间锯齿电弧
  lightning(x1, y1, x2, y2, color = '#ff0') {
    const d = Math.hypot(x2 - x1, y2 - y1);
    const n = Math.max(3, Math.floor(d / 22));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const edge = i === 0 || i === n;
      this.emit(x1 + (x2 - x1) * t + (edge ? 0 : (G.RAND() - 0.5) * 14),
                y1 + (y2 - y1) * t + (edge ? 0 : (G.RAND() - 0.5) * 14), {
        count: 1, speedMin: 5, speedMax: 30,
        lifeMin: 0.1, lifeMax: 0.2,
        radiusMin: 1, radiusMax: 2,
        color: color, type: 'spark',
      });
    }
  }

  update(dt) {
    this.pool.update(dt, (p, dt) => {
      p.life += dt;
      if (p.life >= p.maxLife) { p.alive = false; return; }
      p.vx *= p.friction;
      p.vy *= p.friction;
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    });
  }

  draw(ctx, time) {
    const particles = this.pool.active;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const progress = p.life / p.maxLife;
      const alpha = 1 - progress;
      const r = p.shrink ? p.radius * (1 - progress * 0.7) : p.radius;

      ctx.globalAlpha = alpha;

      if (p.type === 'spark') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = r;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02);
        ctx.stroke();
      } else if (p.type === 'ring') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 3, 0, G.TWO_PI);
        ctx.stroke();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, G.TWO_PI);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
};

// ═══════════════ AOE/特效实体 ═══════════════
G.AOEBlast = class AOEBlast {
  constructor(config) {
    this.x = config.x; this.y = config.y;
    this.maxRadius = config.radius || 50;
    this.radius = 0;
    this.damage = config.damage || 10;
    this.color = config.color || '#f84';
    this.life = 0;
    this.maxLife = config.maxLife || 0.3;
    this.alive = true;
    this.hitEnemies = new Set();
    // 持续区域属性（继承武器点数）
    this.persistent = config.persistent || false;
    this.dot = config.dot || 0;
    this.burnDps = config.burnDps || 0;
    this.freezePower = config.freezePower || 0;
    this.shockPoints = config.shockPoints || 0;
    this.homing = config.homing || 0;
    this.penetration = config.penetration || 0;
    this.bounce = config.bounce || false;
    this.bounceMax = config.bounceMax || 0;
    this.bounceCount = 0;
    this.vx = config.vx || 0;
    this.vy = config.vy || 0;
    this.speed = config.speed || 0;
    this.lifesteal = config.lifesteal || 0;
    this.knockback = config.knockback || 0;
    this.sealRatio = config.sealRatio || 0;
    this.charmRatio = config.charmRatio || 0;
    this.geneTime = config.geneTime || 0;
    this.charmHeal = config.charmHeal || 0;
    this.superAccumRatio = config.superAccumRatio || 0;
    this.superCharmTime = config.superCharmTime || 0;
    this.superGeneTime = config.superGeneTime || 0;
    this.tickInterval = 0.25;
    this.tickTimer = 0;
  }

  update(dt, enemies, events) {
    this.life += dt;
    if (this.life >= this.maxLife) { this.alive = false; return; }
    // 展开动画（前0.15秒）
    const expandTime = this.persistent ? 0.15 : this.maxLife;
    const progress = this.life / expandTime;
    this.radius = this.maxRadius * G.ease.outCubic(Math.min(1, progress));

    // 持续区域移动逻辑
    if (this.persistent && enemies) {
      // 跟踪：区域缓慢追踪最近的敌人
      if (this.homing > 0) {
        let nearest = null, nearDist2 = 250000; // 500px范围
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (!e.alive || e.charmed || e.phaseShift > 0) continue;
          const dx = e.x - this.x, dy = e.y - this.y;
          const d2 = dx*dx + dy*dy;
          if (d2 < nearDist2) { nearDist2 = d2; nearest = e; }
        }
        if (nearest) {
          const targetAngle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
          const moveSpeed = 60 + this.homing * 200; // 跟踪越强，移动越快
          this.x += Math.cos(targetAngle) * moveSpeed * dt;
          this.y += Math.sin(targetAngle) * moveSpeed * dt;
        }
      }
      // 弹射：区域移动并在边界反弹
      if (this.bounce && this.speed > 0) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        if (this.x < 0 || this.x > G.renderer.width) {
          this.vx *= -1; this.bounceCount++;
          this.x = G.clamp(this.x, 0, G.renderer.width);
        }
        if (this.y < 0 || this.y > G.renderer.height) {
          this.vy *= -1; this.bounceCount++;
          this.y = G.clamp(this.y, 0, G.renderer.height);
        }
        if (this.bounceCount > this.bounceMax) { this.bounce = false; this.speed = 0; }
      }

      // 持续区域：每0.25秒伤害范围内的敌人
      this.tickTimer += dt;
      if (this.tickTimer >= this.tickInterval && this.radius > 0) {
        this.tickTimer = 0;
        const r2 = this.radius * this.radius;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (!e.alive || e.charmed || e.phaseShift > 0) continue;
          const dx = e.x - this.x, dy = e.y - this.y;
          if (dx*dx + dy*dy < r2) {
            let tickDmg = this.damage * this.tickInterval;
            // 叠加态区域：合并累计，满值先临时魅惑、到期后封印
            if (this.superAccumRatio > 0 && !e.charmed && !e.traits.includes('boss')) {
              e.bubbleGrow();
              e.superAccum = (e.superAccum || 0) + this.damage * this.superAccumRatio * this.tickInterval;
              if (e.superAccum >= e.maxHp) {
                e.convertToAlly(this.charmHeal);
                e.superTimer = this.superCharmTime;
                e.superGeneTime = this.superGeneTime;
                events.emit('enemy:charmed', { enemy: e });
              }
            } else if (this.charmRatio > 0) {
              if (!e.charmed) {
                e.bubbleGrow(); // 魅惑命中同样触发泡泡变大
                e.charmAccum = (e.charmAccum || 0) + this.damage * this.charmRatio * this.tickInterval;
                if (e.charmAccum >= e.maxHp) { e.convertToAlly(this.charmHeal); events.emit('enemy:charmed', { enemy: e }); }
              }
            } else if (this.sealRatio > 0 && !e.traits.includes('boss')) {
              // 封印区域：不造成伤害，只累计封印；满值吸收目标并夺取其基因
              e.bubbleGrow(); // 封印命中同样触发泡泡变大
              e.sealAccum = (e.sealAccum || 0) + this.damage * this.sealRatio * this.tickInterval;
              if (e.sealAccum >= e.maxHp) {
                const gx = e.x, gy = e.y, trait = e.traits[0] || 'normal';
                e.absorb(events); // 封印吸收：静默击杀
                G.particles.explosion(gx, gy, '#a6f', e.radius * 1.5);
                G.gainGene(trait, this.geneTime, gx, gy);
              }
            } else {
              e.takeDamage(tickDmg, events);
            }
            // 击退：范围伤害也能继承
            if (this.knockback > 0 && e.alive && G.player) {
              const ang = G.angle(G.player.x, G.player.y, e.x, e.y);
              e.vx += Math.cos(ang) * this.knockback * 2;
              e.vy += Math.sin(ang) * this.knockback * 2;
            }
            // 吸血
            if (this.lifesteal > 0 && G.player && G.player.alive) {
              G.player.hp = Math.min(G.player.maxHp, G.player.hp + this.lifesteal * this.tickInterval);
            }
            // 慢性毒药：区域内刷新中毒（固定伤害+刷新时长）
            if (this.dot > 0 && e.alive) e.applyDOT(4, 2);
            // 燃烧：伤害随时间递增，不叠加
            if (this.burnDps > 0 && e.alive) e.applyBurn(this.burnDps, 2);
            // 冰冻：叠加减速，满值冰冻
            if (this.freezePower > 0 && e.alive) {
              e.applyFreeze(this.freezePower * 0.5);
            }
            // 感电：减速
            if (this.shockPoints > 0 && e.alive) {
              e.applyShock();
            }
          }
        }
      }
    }
  }

  draw(ctx, time) {
    const progress = this.life / this.maxLife;
    if (this.persistent) {
      // 持续区域渲染：脉冲效果
      const pulse = 1 + 0.03 * Math.sin((time || 0) * 6);
      const fadeOut = this.life > this.maxLife * 0.8 ? (1 - (this.life - this.maxLife*0.8) / (this.maxLife*0.2)) : 1;
      const alpha = (0.12 + 0.05 * Math.sin((time || 0) * 4)) * fadeOut;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * pulse, 0, G.TWO_PI); ctx.fill();
      ctx.globalAlpha = alpha * 1.5;
      ctx.strokeStyle = this.color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * pulse, 0, G.TWO_PI); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      // 原有短暂爆炸效果
      const alpha = (1 - progress) * 0.5;
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 3 * (1 - progress);
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, G.TWO_PI);
      ctx.stroke();
      ctx.fillStyle = this.color;
      ctx.globalAlpha = alpha * 0.2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, G.TWO_PI);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
};

G.BlackHole = class BlackHole {
  constructor(x, y, duration = 2) {
    this.x = x; this.y = y;
    this.radius = 30;
    this.pullForce = 200;
    this.life = 0;
    this.maxLife = duration;
    this.alive = true;
  }

  update(dt, enemies) {
    this.life += dt;
    if (this.life >= this.maxLife) { this.alive = false; return; }

    // 拉拽敌人
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const d = G.dist(this.x, this.y, e.x, e.y);
      if (d < 200 && d > 5) {
        const force = this.pullForce / (d * 0.5);
        const ang = G.angle(e.x, e.y, this.x, this.y);
        e.vx += Math.cos(ang) * force * dt * 60;
        e.vy += Math.sin(ang) * force * dt * 60;
      }
    }
  }

  draw(ctx, time) {
    const progress = this.life / this.maxLife;
    const alpha = progress < 0.1 ? progress * 10 : progress > 0.8 ? (1 - progress) * 5 : 1;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = alpha;

    // 黑洞核心
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
    grad.addColorStop(0, 'rgba(20,0,40,0.9)');
    grad.addColorStop(0.5, 'rgba(60,20,120,0.4)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, G.TWO_PI);
    ctx.fill();

    // 旋转环
    ctx.strokeStyle = `rgba(150,80,255,${0.5 * alpha})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const r = this.radius * (0.5 + i * 0.3);
      const a = time * (3 + i) + i * 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * 0.3, a, 0, G.TWO_PI);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }
};

// 链式闪电效果
G.ChainLightning = class ChainLightning {
  constructor(points, damage) {
    this.points = points; // [{x,y}, ...]
    this.damage = damage;
    this.life = 0;
    this.maxLife = 0.25;
    this.alive = true;
  }

  update(dt) {
    this.life += dt;
    if (this.life >= this.maxLife) this.alive = false;
  }

  draw(ctx) {
    const progress = this.life / this.maxLife;
    const alpha = 1 - progress;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#8df';
    ctx.lineWidth = 3 * (1 - progress);
    ctx.shadowColor = '#4af';
    ctx.shadowBlur = 10;

    for (let i = 0; i < this.points.length - 1; i++) {
      const p1 = this.points[i];
      const p2 = this.points[i + 1];
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      // 锯齿闪电
      const segments = 5;
      for (let j = 1; j <= segments; j++) {
        const t = j / segments;
        const mx = G.lerp(p1.x, p2.x, t) + (j < segments ? (G.RAND() - 0.5) * 15 : 0);
        const my = G.lerp(p1.y, p2.y, t) + (j < segments ? (G.RAND() - 0.5) * 15 : 0);
        ctx.lineTo(mx, my);
      }
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
};

// 根据权重和可用点数生成实际分配
G.buildPresetPoints = function(key, availablePoints) {
  const preset = G.WeaponPresets[key];
  if (!preset) return null;
  const w = preset.weights;
  const totalWeight = Object.values(w).reduce((s, v) => s + v, 0);
  if (totalWeight === 0) return {};
  // 武器点数 = 可用点数 - 1（留1点给船体hull）
  const weaponBudget = Math.max(3, availablePoints - 1);
  const points = {};
  let allocated = 0;
  const keys = Object.keys(w).filter(k => w[k] > 0).sort((a, b) => w[b] - w[a]);
  for (const k of keys) {
    const raw = (w[k] / totalWeight) * weaponBudget;
    const val = Math.max(1, Math.min(G.POINT_MAX, Math.round(raw)));
    points[k] = val;
    allocated += val;
  }
  // 超出预算时从最大项减去
  while (allocated > weaponBudget && keys.length > 0) {
    const maxKey = keys.reduce((a, b) => (points[a] || 0) >= (points[b] || 0) ? a : b);
    if (points[maxKey] > 1) { points[maxKey]--; allocated--; }
    else break;
  }
  // 填充零值项（覆盖全部武器属性，含新增项）
  for (const k of Object.keys(G.StatMeta)) { if (!(k in points)) points[k] = 0; }
  return points;
};

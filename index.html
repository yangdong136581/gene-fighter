<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-ogp-key" content="ea8e2e0d-3406-45a2-a869-4058b2002275" />
<script src="https://sdk.play.fun"></script>
<title>Gene Fighter - 基因战机</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a12;
  overflow: hidden;
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  cursor: none;
  user-select: none;
}

body.menu-active { cursor: default; }

button, .btn-main, .btn-icon, .weapon-btn, input, label { cursor: pointer; }

#gameCanvas {
  display: block;
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
}

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between;
  padding: 12px 24px;
  background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
  z-index: 10; pointer-events: none;
}
.hud-left, .hud-right { display: flex; gap: 24px; }
.hud-item { display: flex; flex-direction: column; align-items: center; }
.hud-label { font-size: 10px; color: #8af; letter-spacing: 2px; font-weight: 700; }
.hud-value { font-size: 22px; color: #fff; font-weight: 900; text-shadow: 0 0 12px #4af; }

/* 基因掠夺栏 */
#gene-bar {
  position: fixed; top: 58px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; z-index: 5; pointer-events: none;
}
.gene-chip {
  display: flex; align-items: center; gap: 4px;
  background: rgba(8,12,26,0.82); border: 1px solid #a6f; border-radius: 14px;
  padding: 3px 9px; font-size: 12px;
  box-shadow: 0 0 10px rgba(160,100,255,0.35);
  animation: genePop 0.25s ease-out;
}
.gene-chip b { color: #fff; font-weight: 700; }
@keyframes genePop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* HP Bar */
#hp-bar-container {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  width: 300px; height: 18px;
  background: rgba(255,0,0,0.15);
  border: 2px solid rgba(255,80,80,0.5);
  border-radius: 9px; overflow: hidden;
  z-index: 10; pointer-events: none;
}
#hp-bar {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #f44, #ff6b6b);
  border-radius: 7px;
  transition: width 0.2s ease;
  box-shadow: 0 0 12px rgba(255,68,68,0.6);
}
#shield-bar {
  position: absolute; top: 0; left: 0;
  height: 100%; width: 0%;
  background: linear-gradient(90deg, rgba(68,170,255,0.5), rgba(100,200,255,0.3));
  border-radius: 7px;
  transition: width 0.3s ease;
  box-shadow: 0 0 12px rgba(68,170,255,0.4);
}
#hp-text {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: #fff; font-weight: 700;
  text-shadow: 0 1px 3px #000;
}

/* Wave Announce */
#wave-announce {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; z-index: 20; pointer-events: none;
  animation: waveIn 2.5s ease forwards;
}
#wave-announce.hidden { display: none; }
.wave-text { font-size: 64px; font-weight: 900; color: #fff; text-shadow: 0 0 40px #4af, 0 0 80px #28f; letter-spacing: 8px; }
.wave-sub { font-size: 18px; color: #8cf; margin-top: 8px; letter-spacing: 3px; }

@keyframes waveIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
}

/* Damage Numbers */
#damage-layer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 15;
}
.dmg-num {
  position: absolute;
  font-size: 16px; font-weight: 900;
  color: #ff4; text-shadow: 0 0 6px #fa0, 0 1px 2px #000;
  animation: dmgFloat 0.8s ease-out forwards;
  pointer-events: none;
}
.dmg-num.crit { font-size: 24px; color: #f44; text-shadow: 0 0 10px #f00; }
.dmg-num.heal { color: #4f4; text-shadow: 0 0 6px #0f0; }

@keyframes dmgFloat {
  0% { opacity: 1; transform: translateY(0) scale(1.2); }
  100% { opacity: 0; transform: translateY(-40px) scale(0.8); }
}

/* ═══ Loadout Screen ═══ */
#loadout-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  align-items: center;
  background: radial-gradient(ellipse at center, rgba(8,12,30,0.97) 0%, rgba(3,3,10,0.99) 100%);
  z-index: 200;
  padding: 20px 40px;
  overflow-y: auto;
}
#loadout-screen.hidden { display: none; }

.loadout-title {
  font-size: 48px; font-weight: 900; color: #fff;
  text-shadow: 0 0 30px #4af, 0 0 60px #28f;
  letter-spacing: 10px; margin-top: 10px;
}
.loadout-subtitle {
  font-size: 14px; color: #568; letter-spacing: 10px; font-weight: 300;
  margin-bottom: 20px;
}
.loadout-header {
  display: flex; align-items: center; gap: 16px;
  position: relative;
}
.btn-lang {
  position: absolute; right: -60px; top: 10px;
  padding: 6px 14px;
  background: rgba(40, 60, 120, 0.3);
  border: 1px solid rgba(80, 130, 220, 0.3);
  border-radius: 6px;
  color: #8ab; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.btn-lang:hover { background: rgba(50, 80, 160, 0.4); color: #fff; }

.loadout-body {
  display: flex; gap: 24px;
  width: 100%; max-width: 960px;
  flex: 1;
}

.loadout-left { flex: 1; min-width: 0; }
.loadout-right {
  width: 260px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center;
  padding-top: 8px;
}

.section-label {
  color: #8ab; font-size: 13px; font-weight: 700;
  letter-spacing: 2px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.points-remain {
  color: #4af; font-size: 14px; font-weight: 800;
}

/* Preset Row */
.preset-row {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.preset-btn {
  padding: 6px 14px;
  background: rgba(40, 60, 120, 0.3);
  border: 1px solid rgba(80, 130, 220, 0.25);
  border-radius: 8px;
  color: #9ab; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.preset-btn:hover { background: rgba(50, 80, 160, 0.4); color: #cdf; }
.preset-btn.active {
  background: rgba(50, 100, 220, 0.4);
  border-color: #4af; color: #fff;
  box-shadow: 0 0 10px rgba(68, 170, 255, 0.3);
}

/* Stat Grid */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-bottom: 12px; }

.alloc-row {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 0;
}
.alloc-icon { font-size: 14px; width: 20px; text-align: center; }
.alloc-label {
  width: 32px; color: #8aa; font-size: 11px; font-weight: 600;
}
.alloc-btn {
  width: 28px; height: 28px;
  background: rgba(60, 80, 140, 0.4);
  border: 1px solid rgba(100, 160, 255, 0.3);
  border-radius: 6px;
  color: #8cf; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.alloc-btn:hover { background: rgba(80, 120, 200, 0.5); color: #fff; }
.alloc-btn:active { transform: scale(0.9); }
.alloc-btn.disabled { opacity: 0.3; cursor: not-allowed; }

.alloc-bar-wrap {
  flex: 1; height: 10px;
  background: rgba(40, 60, 100, 0.3);
  border-radius: 5px; overflow: hidden;
  position: relative;
}
.alloc-bar {
  height: 100%;
  border-radius: 5px;
  transition: width 0.2s, background 0.3s;
}
.alloc-val {
  width: 24px; text-align: center;
  color: #4af; font-size: 14px; font-weight: 800;
}

/* ═══ 加点卡牌 ═══ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
  gap: 8px; margin-bottom: 12px;
}
.stat-card {
  background: rgba(20, 35, 70, 0.45);
  border: 1px solid rgba(80, 130, 220, 0.22);
  border-radius: 10px;
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 5px;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.stat-card:hover { background: rgba(30, 50, 100, 0.5); border-color: rgba(120, 180, 255, 0.5); }
.stat-card.has-pts {
  border-color: var(--card-color, #4af);
  box-shadow: inset 0 0 12px rgba(80, 150, 255, 0.08), 0 0 6px rgba(80, 150, 255, 0.12);
}
.stat-card-head { display: flex; align-items: center; gap: 6px; }
.stat-card-icon { display: flex; align-items: center; }
.stat-card-name { flex: 1; color: #cde; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.stat-card-tag {
  font-size: 9px; color: #7cba9a; font-weight: 700;
  border: 1px solid rgba(110, 200, 150, 0.45); border-radius: 4px;
  padding: 0 3px; letter-spacing: 1px;
}
.stat-card-val { color: #4af; font-size: 14px; font-weight: 800; min-width: 18px; text-align: right; }
.stat-card.has-pts .stat-card-val { color: var(--card-color, #4af); }
.stat-card-desc { color: #789; font-size: 10px; line-height: 1.4; min-height: 28px; }
.stat-card-bar-wrap { height: 6px; background: rgba(40, 60, 100, 0.4); border-radius: 3px; overflow: hidden; }
.stat-card-bar { height: 100%; border-radius: 3px; transition: width 0.2s; }
.stat-card-btns { display: flex; gap: 6px; }
.stat-card-btns .alloc-btn { flex: 1; width: auto; height: 24px; font-size: 14px; line-height: 1; }

/* 波次间卡牌弹窗 */
.wave-card-grid {
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  max-width: 860px; width: 92%;
  max-height: 58vh; overflow-y: auto; padding: 4px;
  margin-bottom: 12px;
}

/* Preview */
.preview-weapon-name {
  font-size: 22px; font-weight: 800; color: #fff;
  text-shadow: 0 0 15px rgba(68, 170, 255, 0.5);
  letter-spacing: 3px; margin-bottom: 12px;
  text-align: center;
}
.preview-canvas-wrap {
  width: 240px; height: 240px;
  background: rgba(10, 15, 30, 0.6);
  border: 1px solid rgba(80, 130, 220, 0.2);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
}
#preview-canvas { width: 240px; height: 240px; }

.preview-stats {
  width: 100%;
  display: flex; flex-direction: column; gap: 4px;
}
.ps-row {
  display: flex; justify-content: space-between;
  color: #789; font-size: 11px;
}
.ps-row .ps-val { color: #adf; font-weight: 700; }

.preview-shape {
  margin-top: 8px;
  color: #68a; font-size: 11px; text-align: center;
  letter-spacing: 1px;
}

.loadout-controls {
  text-align: center; margin-top: 16px; padding-bottom: 20px;
}
.controls-info {
  text-align: center; margin-bottom: 16px;
}
.controls-info p {
  color: #556; font-size: 13px; line-height: 1.8;
  letter-spacing: 1px;
}

.btn-main {
  padding: 14px 52px;
  background: linear-gradient(135deg, #28f, #4af);
  border: none; border-radius: 12px;
  color: #fff; font-size: 20px; font-weight: 700;
  letter-spacing: 4px; cursor: pointer;
  box-shadow: 0 0 30px rgba(40, 100, 255, 0.4);
  transition: all 0.3s;
}
.btn-main:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 50px rgba(40, 100, 255, 0.6);
}

/* Game Over */
#gameover-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(5, 0, 0, 0.9);
  z-index: 200;
}
#gameover-screen.hidden { display: none; }
.go-title {
  font-size: 56px; font-weight: 900; color: #f44;
  text-shadow: 0 0 40px #f00; letter-spacing: 8px;
  margin-bottom: 32px;
}
.go-stats { margin-bottom: 40px; text-align: center; }
.go-stats p { color: #aaa; font-size: 18px; line-height: 2.2; }
.go-stats span { color: #fff; font-weight: 700; }

/* ═══ Wave Allocation Overlay ═══ */
#wave-alloc {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(3, 5, 15, 0.85);
  z-index: 150;
  animation: fadeIn 0.3s ease;
}
#wave-alloc.hidden { display: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.wave-alloc-title {
  font-size: 42px; font-weight: 900; color: #4f4;
  text-shadow: 0 0 30px rgba(80,255,80,0.5);
  letter-spacing: 6px; margin-bottom: 8px;
}
.wave-alloc-sub {
  font-size: 18px; color: #adf; font-weight: 700; margin-bottom: 16px;
}
.wave-alloc-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px 16px; max-width: 560px; width: 90%;
  margin-bottom: 16px;
}
.wave-alloc-btn {
  margin-top: 8px; padding: 12px 40px;
  font-size: 16px;
}


</style>
</head>
<body class="menu-active">

<canvas id="gameCanvas"></canvas>

<!-- HUD 顶部信息栏 -->
<div id="hud">
  <div class="hud-left">
    <div class="hud-item">
      <span class="hud-label">WAVE</span>
      <span id="hud-wave" class="hud-value">1</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">SCORE</span>
      <span id="hud-score" class="hud-value">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">KILLS</span>
      <span id="hud-kills" class="hud-value">0</span>
    </div>
  </div>
  <div class="hud-right">
    <div class="hud-item">
      <span class="hud-label">WEAPON</span>
      <span id="hud-weapon" class="hud-value">—</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">POINTS</span>
      <span id="hud-points" class="hud-value">0</span>
    </div>
  </div>
</div>

<!-- 基因掠夺栏（封印夺取的临时能力） -->
<div id="gene-bar"></div>

<!-- 血条 -->
<div id="hp-bar-container">
  <div id="hp-bar"></div>
  <div id="shield-bar" style="display:none"></div>
  <span id="hp-text">100 / 100</span>
</div>

<!-- 波次公告 -->
<div id="wave-announce" class="hidden">
  <div class="wave-text">WAVE <span id="wave-num">1</span></div>
  <div class="wave-sub" id="wave-sub"></div>
</div>

<!-- 波次间加点弹窗 -->
<div id="wave-alloc" class="hidden">
  <div class="wave-alloc-title" data-i18n="wave_clear">WAVE CLEAR!</div>
  <div class="wave-alloc-sub"><span data-i18n="points_available">可用点数</span>: <span id="wave-pts">1</span></div>
  <div class="card-grid wave-card-grid" id="wave-alloc-grid"></div>
  <button id="wave-alloc-continue" class="btn-main wave-alloc-btn" data-i18n="continue_btn">继续</button>
</div>

<!-- 伤害数字层 -->
<div id="damage-layer"></div>

<!-- ═══ 战前装备界面 ═══ -->
<div id="loadout-screen">
  <div class="loadout-header">
    <div class="loadout-title" data-i18n="game_title">GENE FIGHTER</div>
    <div class="loadout-subtitle">GENE FIGHTER</div>
    <button id="btn-lang" class="btn-lang" data-i18n="lang_switch">中</button>
  </div>

  <div class="loadout-body">
    <!-- 左栏：模板选择 + 武器加点 -->
    <div class="loadout-left">
      <div class="section-label" data-i18n="select_preset">选择模板</div>
      <div class="preset-row" id="preset-row"></div>

      <div class="section-label">
        <span data-i18n="loadout_cards">加点卡牌</span>
        <span class="points-remain"><span data-i18n="points_remain">剩余</span> <span id="points-remain">15</span> / <span id="points-total">15</span> <span data-i18n="points_unit">点</span></span>
      </div>
      <div class="card-grid" id="card-grid"></div>
    </div>

    <!-- 右栏：预览 -->
    <div class="loadout-right">
      <div class="preview-weapon-name" id="preview-name">Light Pulse</div>
      <div class="preview-canvas-wrap">
        <canvas id="preview-canvas" width="240" height="240"></canvas>
      </div>
      <div class="preview-stats" id="preview-stats"></div>
      <div class="preview-shape" id="preview-shape"></div>
      <div class="section-label" style="margin-top:8px" data-i18n="ship_stats">飞船加点</div>
      <div class="preview-stats" id="ship-stats"></div>
    </div>
  </div>

  <div class="loadout-controls">
    <div class="controls-info">
      <p data-i18n="controls_info">WASD 移动 | 鼠标瞄准 | 左键/空格射击</p>
    </div>
    <button id="btn-start" class="btn-main" data-i18n="launch">出击！</button>
  </div>
</div>

<!-- 游戏结束 -->
<div id="gameover-screen" class="hidden">
  <div class="go-title" data-i18n="game_over">GAME OVER</div>
  <div class="go-stats">
    <p><span data-i18n="wave_reached">到达波次</span>: <span id="go-wave">0</span></p>
    <p><span data-i18n="final_score">最终分数</span>: <span id="go-score">0</span></p>
    <p><span data-i18n="total_kills">击杀总数</span>: <span id="go-kills">0</span></p>
  </div>
  <button id="btn-restart" class="btn-main" data-i18n="restart">返回装备</button>
</div>

<script>
// ===== utils.js =====
// ═══════════════════════════════════════════════════════
// utils.js — 数学工具 / 对象池 / 缓动函数 / 常量 / 国际化
// ═══════════════════════════════════════════════════════
var G = window.Game = {};
// ── 常量 ──
G.TWO_PI = Math.PI * 2;
G.DEG = Math.PI / 180;
G.RAND = Math.random;

// ── SVG图标系统 ──
G.icon = function(key, color) {
  const c = color || '#fff';
  const s = 16; // viewBox size
  const paths = {
    // 武器属性
    power: `<path d="M3 8h7l-2-3 6 3-6 3 2-3H3z" fill="${c}"/><path d="M12 4l2 4-2 4" stroke="${c}" stroke-width="1.5" fill="none"/>`,
    rate: `<path d="M2 5h4l1 2H2zM2 9h5l1 2H2zM2 13h4l1 2H2z" fill="${c}" opacity="0.7"/><path d="M10 8l3 0" stroke="${c}" stroke-width="2"/><path d="M12 6l2 2-2 2" stroke="${c}" stroke-width="1.5" fill="none"/>`,
    pierce: `<line x1="2" y1="8" x2="14" y2="8" stroke="${c}" stroke-width="2"/><circle cx="5" cy="8" r="2" fill="none" stroke="${c}" stroke-width="1"/><circle cx="11" cy="8" r="2" fill="none" stroke="${c}" stroke-width="1"/>`,
    homing: `<circle cx="8" cy="8" r="4" fill="none" stroke="${c}" stroke-width="1" stroke-dasharray="2 2"/><circle cx="8" cy="8" r="1.5" fill="${c}"/><path d="M12 4l-2 2M12 4h-3M12 4v3" stroke="${c}" stroke-width="1.2"/>`,
    burst: `<circle cx="4" cy="8" r="2" fill="${c}"/><circle cx="8" cy="5" r="2" fill="${c}"/><circle cx="12" cy="8" r="2" fill="${c}"/><circle cx="8" cy="11" r="2" fill="${c}" opacity="0.5"/>`,
    split: `<line x1="2" y1="8" x2="8" y2="8" stroke="${c}" stroke-width="2"/><line x1="8" y1="8" x2="13" y2="4" stroke="${c}" stroke-width="1.5"/><line x1="8" y1="8" x2="13" y2="12" stroke="${c}" stroke-width="1.5"/>`,
    lifetime: `<rect x="4" y="3" width="8" height="10" rx="2" fill="none" stroke="${c}" stroke-width="1.5"/><line x1="8" y1="6" x2="8" y2="9" stroke="${c}" stroke-width="1.5"/><line x1="8" y1="9" x2="10" y2="10" stroke="${c}" stroke-width="1"/>`,
    dot: `<circle cx="6" cy="8" r="3" fill="${c}" opacity="0.4"/><circle cx="10" cy="8" r="2" fill="${c}" opacity="0.7"/><circle cx="13" cy="8" r="1" fill="${c}"/>`,
    zone: `<circle cx="8" cy="8" r="6" fill="${c}" opacity="0.15"/><circle cx="8" cy="8" r="4" fill="none" stroke="${c}" stroke-width="1" stroke-dasharray="2 1"/><circle cx="8" cy="8" r="1.5" fill="${c}"/>`,

// ── 数学工具 ──
G.lerp = (a, b, t) => a + (b - a) * t;
G.clamp = (v, min, max) => v < min ? min : v > max ? max : v;
G.dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
G.angle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
G.randFloat = (min, max) => G.RAND() * (max - min) + min;
G.randInt = (min, max) => Math.floor(G.RAND() * (max - min + 1)) + min;
G.randSign = () => G.RAND() < 0.5 ? -1 : 1;

G.angleDiff = (a, b) => {
  let d = ((b - a) % G.TWO_PI + G.TWO_PI + Math.PI) % G.TWO_PI - Math.PI;
  return d;
};

G.rotatePoint = (x, y, cx, cy, angle) => {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const dx = x - cx, dy = y - cy;
  return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
};

// ── 缓动函数 ──
G.ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1,
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  inOutQuad: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
};

G.hexToRgb = (hex) => {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return { r, g, b };
};

// ── 对象池 ──
G.Pool = class Pool {
  constructor(factory, reset, initialSize = 100) {
    this.factory = factory;
    this.reset = reset;
    this.pool = [];
    this.active = [];
    for (let i = 0; i < initialSize; i++) {
      this.pool.push(factory());
    }
  }

  get() {
    const obj = this.pool.length > 0 ? this.pool.pop() : this.factory();
    obj.alive = true;
    this.active.push(obj);
    return obj;
  }

  release(obj) {
    obj.alive = false;
    const idx = this.active.indexOf(obj);
    if (idx !== -1) {
      this.active.splice(idx, 1);
      this.reset(obj);
      this.pool.push(obj);
    }
  }

  releaseAll() {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const obj = this.active[i];
      obj.alive = false;
      this.reset(obj);
      this.pool.push(obj);
    }
    this.active.length = 0;
  }

  update(dt, updateFn) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const obj = this.active[i];
      if (!obj.alive) {
        this.active.splice(i, 1);
        this.reset(obj);
        this.pool.push(obj);
        continue;
      }
      updateFn(obj, dt);
      if (!obj.alive) {
        this.active.splice(i, 1);
        this.reset(obj);
        this.pool.push(obj);
      }
    }
  }

  get count() { return this.active.length; }
};

// ── 空间哈希（碰撞检测优化） ──
G.SpatialHash = class SpatialHash {
  constructor(cellSize = 64) {
    this.cellSize = cellSize;
    this.cells = new Map();
  }

  clear() { this.cells.clear(); }

  _key(x, y) {
    const cx = Math.floor(x / this.cellSize);
    const cy = Math.floor(y / this.cellSize);
    return (cx * 73856093) ^ (cy * 19349663); // hash
  }

  insert(entity) {
    const key = this._key(entity.x, entity.y);
    if (!this.cells.has(key)) this.cells.set(key, []);
    this.cells.get(key).push(entity);
  }

  query(x, y, radius) {
    const results = [];
    const cs = this.cellSize;
    const minCx = Math.floor((x - radius) / cs);
    const maxCx = Math.floor((x + radius) / cs);
    const minCy = Math.floor((y - radius) / cs);
    const maxCy = Math.floor((y + radius) / cs);
    for (let cx = minCx; cx <= maxCx; cx++) {
      for (let cy = minCy; cy <= maxCy; cy++) {
        const key = (cx * 73856093) ^ (cy * 19349663);
        const cell = this.cells.get(key);
        if (cell) {
          for (let i = 0; i < cell.length; i++) {
            results.push(cell[i]);
          }
        }
      }
    }
    return results;
  }
};

// ── 屏幕震动 ──
G.ScreenShake = class ScreenShake {
  constructor() {
    this.intensity = 0;
    this.duration = 0;
    this.timer = 0;
    this.offsetX = 0;
    this.offsetY = 0;
  }

  trigger(intensity, duration) {
    this.intensity = Math.max(this.intensity, intensity);
    this.duration = Math.max(this.duration, duration);
    this.timer = 0;
  }

  update(dt) {
    if (this.duration <= 0) {
      this.offsetX = 0;
      this.offsetY = 0;
      return;
    }
    this.timer += dt;
    const progress = this.timer / this.duration;
    const decay = 1 - progress;
    if (progress >= 1) {
      this.duration = 0;
      this.intensity = 0;
      this.offsetX = 0;
      this.offsetY = 0;
      return;
    }
    const mag = this.intensity * decay;
    this.offsetX = (G.RAND() * 2 - 1) * mag;
    this.offsetY = (G.RAND() * 2 - 1) * mag;
  }
};

// ── 慢动作（击中停顿） ──
G.HitStop = class HitStop {
  constructor() {
    this.timer = 0;
    this.scale = 1;
  }

  trigger(duration, scale = 0.1) {
    this.timer = Math.max(this.timer, duration);
    this.scale = scale;
  }

  update(dt) {
    if (this.timer > 0) {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.timer = 0;
        this.scale = 1;
      }
      return this.scale;
    }
    return 1;
  }
};

// ── 事件总线（Event Bus） ──
G.EventBus = class EventBus {
  constructor() {
    this.listeners = new Map();
  }

  on(event, callback, priority = 0) {
    if (!this.listeners.has(event)) this.listeners.set(event, []);
    const list = this.listeners.get(event);
    list.push({ callback, priority });
    list.sort((a, b) => b.priority - a.priority);
    return () => this.off(event, callback);
  }

  off(event, callback) {
    const list = this.listeners.get(event);
    if (list) {
      const idx = list.findIndex(l => l.callback === callback);
      if (idx !== -1) list.splice(idx, 1);
    }
  }

  emit(event, data) {
    const list = this.listeners.get(event);
    if (list) {
      for (let i = 0; i < list.length; i++) {
        list[i].callback(data);
      }
    }
  }
};

// ── 输入系统 ──
G.Input = class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = new Set();
    this.keysJustPressed = new Set();
    this.mouse = { x: 0, y: 0, down: false, justDown: false };
    this.scrollDelta = 0;

    window.addEventListener('keydown', e => {
      if (!this.keys.has(e.code)) this.keysJustPressed.add(e.code);
      this.keys.add(e.code);
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => this.keys.delete(e.code));

    canvas.addEventListener('mousemove', e => {
      this.mouse.x = e.clientX;
      this.mouse.y = e.clientY;
    });
    canvas.addEventListener('mousedown', e => {
      if (e.button === 0) { this.mouse.down = true; this.mouse.justDown = true; }
    });
    canvas.addEventListener('mouseup', e => {
      if (e.button === 0) this.mouse.down = false;
    });
    canvas.addEventListener('wheel', e => {
      this.scrollDelta += Math.sign(e.deltaY);
      e.preventDefault();
    }, { passive: false });

    // prevent context menu
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  }

  isDown(code) { return this.keys.has(code); }
  justPressed(code) { return this.keysJustPressed.has(code); }

  get movement() {
    let dx = 0, dy = 0;
    if (this.isDown('KeyW') || this.isDown('ArrowUp')) dy -= 1;
    if (this.isDown('KeyS') || this.isDown('ArrowDown')) dy += 1;
    if (this.isDown('KeyA') || this.isDown('ArrowLeft')) dx -= 1;
    if (this.isDown('KeyD') || this.isDown('ArrowRight')) dx += 1;
    // normalize diagonal
    if (dx !== 0 && dy !== 0) {
      const inv = 1 / Math.SQRT2;
      dx *= inv; dy *= inv;
    }
    return { x: dx, y: dy };
  }

  get shooting() {
    return this.mouse.down || this.isDown('Space');
  }

  endFrame() {
    this.keysJustPressed.clear();
    this.mouse.justDown = false;
    this.scrollDelta = 0;
  }
};

// ── 渲染器 ──
G.Renderer = class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  }

  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
    this.width = this.canvas.width;
    this.height = this.canvas.height;
    this.centerX = this.width / 2;
    this.centerY = this.height / 2;
  }

  clear() {
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.clearRect(0, 0, this.width, this.height);
  }

  applyShake(shake) {
    this.ctx.setTransform(1, 0, 0, 1, shake.offsetX, shake.offsetY);
  }

  drawBackground(time) {
    const ctx = this.ctx;
    // 深空背景 + 微弱网格
    ctx.fillStyle = '#080810';
    ctx.fillRect(0, 0, this.width, this.height);

    // 星空层（伪随机固定星点）
    ctx.fillStyle = 'rgba(200,220,255,0.3)';
    const seed = 12345;
    for (let i = 0; i < 80; i++) {
      const px = ((seed * (i + 1) * 7919) % this.width);
      const py = ((seed * (i + 1) * 6271) % this.height);
      const size = ((i * 3) % 3) * 0.5 + 0.5;
      const flicker = 0.5 + 0.5 * Math.sin(time * 2 + i);
      ctx.globalAlpha = flicker * 0.4;
      ctx.fillRect(px, py, size, size);
    }
    ctx.globalAlpha = 1;

    // 微弱网格
    ctx.strokeStyle = 'rgba(40,60,100,0.08)';
    ctx.lineWidth = 1;
    const gridSize = 80;
    for (let x = 0; x < this.width; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, this.height);
      ctx.stroke();
    }
    for (let y = 0; y < this.height; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(this.width, y);
      ctx.stroke();
    }
  }
};

// ── 游戏循环 ──
G.GameLoop = class GameLoop {
  constructor() {
    this.lastTime = 0;
    this.accumulator = 0;
    this.fixedDt = 1 / 60;
    this.running = false;
    this.updateFn = null;
    this.renderFn = null;
    this._frame = this._frame.bind(this);
  }

  start(updateFn, renderFn) {
    this.updateFn = updateFn;
    this.renderFn = renderFn;
    this.running = true;
    this.lastTime = performance.now() / 1000;
    requestAnimationFrame(this._frame);
  }

  stop() { this.running = false; }

  _frame(timestamp) {
    if (!this.running) return;
    const now = timestamp / 1000;
    let dt = now - this.lastTime;
    this.lastTime = now;

    // 防止大跳帧
    if (dt > 0.1) dt = 0.1;

    this.accumulator += dt;

    // 固定步长物理更新
    while (this.accumulator >= this.fixedDt) {
      this.updateFn(this.fixedDt);
      this.accumulator -= this.fixedDt;
    }

    this.renderFn(now);
    requestAnimationFrame(this._frame);
  }
};

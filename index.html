  reflect: p => p * 3,
  shield:  p => p * 15,
  reactive: p => p, // 反应装甲：每次受击触发 点数 次反应，每次发射一整轮武器齐射
  guard:   p => p, // 防御无人机：每点1架，继承10%母船属性环绕护卫（不攻击）
};
G.ShipMeta = {
  hull:    { label: 'ship_hull', icon: 'hull', desc: 'ship_desc_hull' },
  regen:   { label: 'ship_regen', icon: 'regen', desc: 'ship_desc_regen' },
  reflect: { label: 'ship_reflect', icon: 'reflect', desc: 'ship_desc_reflect' },
  shield:  { label: 'ship_shield', icon: 'shield', desc: 'ship_desc_shield' },
  reactive: { label: 'ship_reactive', icon: 'reactive', desc: 'ship_desc_reactive' },
  guard:   { label: 'ship_guard', icon: 'guard', desc: 'ship_desc_guard' },
};

// ═══════════════ 武器构建 ═══════════════
G.buildWeaponFromPoints = function(pts) {
  const c = G.StatCalc;
  const damage = c.power(pts.power);
  const fireRate = c.rate(pts.rate);
  const penetration = c.pierce(pts.pierce);
  const homing = c.homing(pts.homing);
  const burst = c.burst(pts.burst);
  const split = c.split(pts.split);
  const maxLife = c.lifetime(pts.lifetime);
  const dot = c.dot(pts.dot);
  const zoneRadius = c.zone(pts.zone);
  const bounce = c.bounce(pts.bounce);
  const burnDps = c.burn(pts.burn || 0);
  const freezePower = c.freeze(pts.freeze || 0);
  const shockPoints = c.shock(pts.shock || 0);
  const lifesteal = c.lifesteal(pts.lifesteal || 0);
  const knockback = c.knockback(pts.knockback || 0);
  const sealRatio = c.seal(pts.seal || 0);
  const charmRatio = pts.charm ? c.charm(pts.charm) : 0;
  const geneTime = (pts.seal || 0) * 10; // 封印完成后夺取基因时长（每点+10秒）
  const charmHeal = pts.charm || 0;     // 魅惑转化后友军每秒回血（每点+1）
  const droneCount = pts.drone || 0;    // 无人机数量（>0时替代基础射击）
  const strikerCount = pts.striker || 0; // 进攻无人机数量（冲锋攻击）
  // 叠加态：魅惑+封印同时存在时合并为单一累计，满值先魅惑后封印
  const superMode = sealRatio > 0 && charmRatio > 0;
  const superAccumRatio = superMode ? sealRatio + charmRatio : 0;
  const charmProp = superMode ? charmRatio / superAccumRatio : 0; // 魅惑伤害比例
  const sealProp = superMode ? sealRatio / superAccumRatio : 0;   // 封印伤害比例
  const superCharmTime = superMode ? 20 * (pts.charm || 0) * charmProp : 0; // 临时魅惑时长
  const superGeneTime = superMode ? geneTime * sealProp : 0;                // 封印后基因时长
  const bulletSpeed = 500 + pts.power * 30;
  const spread = burst > 1 ? 0.12 + burst * 0.05 : 0.01;
  const bulletRadius = 2.5 + pts.power * 0.15 + pts.zone * 0.03;
  const color = G.computeBulletColor(pts);
  const trailColor = (() => {
    const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
    return `rgba(${r},${g},${b},0.3)`;
  })();

  return {
    name: G.generateWeaponName(pts), points: { ...pts },
    damage, fireRate, bulletSpeed, penetration, homing, burst, split,
    maxLife, dot, zoneRadius, bounce, burnDps, freezePower, shockPoints,
    lifesteal, knockback, sealRatio, charmRatio, geneTime, charmHeal,
    droneCount, strikerCount, superAccumRatio, superCharmTime, superGeneTime,
    bulletRadius, color, trailColor, spread,
    bulletShape: G.computeBulletShape(pts), specials: {},
  };
};

G.buildShipFromPoints = function(pts) {
  const c = G.ShipCalc;
  return {
    maxHp: c.hull(pts.hull),
    regen: c.regen(pts.regen),
    reflect: c.reflect(pts.reflect),
    maxShield: c.shield(pts.shield),
    reactive: c.reactive(pts.reactive || 0),
    guard: c.guard(pts.guard || 0),
    points: { ...pts },
    visual: G.computeShipVisual(pts),
  };
};

// ═══════════════ 动态命名（精准反映加点组合：主词条定武器型、副词条定前缀、高点点分级强化） ═══════════════
G.generateWeaponName = function(pts) {
  const zh = G.currentLang === 'zh';
  const sorted = Object.keys(pts).map(k => ({ key: k, val: pts[k] })).filter(s => s.val > 0).sort((a, b) => b.val - a.val);
  if (!sorted.length) return zh ? '基础脉冲炮' : 'Light Pulse';
  const top = sorted[0], second = sorted[1];
  if (top.val < 3) return zh ? '轻型脉冲炮' : 'Light Pulse';
  // 前缀=次要特质，后缀=主要武器型
  const P = { power:'毁灭', rate:'急速', pierce:'贯穿', homing:'追踪', burst:'散射',
    split:'分裂', lifetime:'远程', dot:'腐蚀', zone:'轰炸', bounce:'弹射',
    burn:'灼烧', freeze:'冰封', shock:'雷霆',
    lifesteal:'汲血', knockback:'震荡', seal:'封印', charm:'魅惑', drone:'蜂群', striker:'突袭', __curse:'咒誓' };
  const S = { power:'重炮', rate:'连射', pierce:'穿甲弹', homing:'导弹', burst:'弹幕',
    split:'裂变', lifetime:'狙击', dot:'剧毒', zone:'领域', bounce:'回旋',
    burn:'烈焰', freeze:'寒霜', shock:'电击',
    lifesteal:'血饮', knockback:'冲拳', seal:'咒印', charm:'迷心', drone:'机巢', striker:'突击' };
  const PE = { power:'Doom', rate:'Rapid', pierce:'Piercing', homing:'Homing', burst:'Scatter',
    split:'Split', lifetime:'Longshot', dot:'Corrosive', zone:'Blast', bounce:'Ricochet',
    burn:'Scorch', freeze:'Frost', shock:'Thunder',
    lifesteal:'Vampiric', knockback:'Slam', seal:'Sealing', charm:'Charming', drone:'Drone', striker:'Striker', __curse:'Hexbound' };
  const SE = { power:'Cannon', rate:'Barrage', pierce:'Railgun', homing:'Missile', burst:'Storm',
    split:'Fission', lifetime:'Sniper', dot:'Venom', zone:'Field', bounce:'Boomerang',
    burn:'Inferno', freeze:'Cryo', shock:'Lightning',
    lifesteal:'Leech', knockback:'Knocker', seal:'Rune', charm:'Siren', drone:'Hive', striker:'Raptor' };
  // 分级前缀：主词条点数越高，品阶越高
  const tier = top.val >= 14 ? (zh ? '神话·' : 'Mythic ') : top.val >= 9 ? (zh ? '超·' : 'Ultra ') : '';
  // 副词条判定：第二高点数达到主词条一半且不少于3；封印+魅惑共存时启用专属组合词条"咒誓"
  let prefixKey = null;
  const curseCombo = (pts.seal || 0) > 0 && (pts.charm || 0) > 0 && top.key !== 'seal' && top.key !== 'charm';
  if (curseCombo) prefixKey = '__curse';
  else if (second && second.val >= Math.max(3, Math.ceil(top.val * 0.5))) prefixKey = second.key;
  if (zh) {
    if (prefixKey) return tier + P[prefixKey] + S[top.key];
    if (top.val >= 6) return tier + P[top.key] + S[top.key];
    return tier + P[top.key] + '弹';
  }
  if (prefixKey) return tier + PE[prefixKey] + ' ' + SE[top.key];
  if (top.val >= 6) return tier + PE[top.key] + ' ' + SE[top.key];
  return tier + PE[top.key] + ' Bolt';
};

// ═══════════════ 子弹颜色 ═══════════════
G.computeBulletColor = function(pts) {
  const hueMap = { power:0, rate:200, pierce:50, homing:280, burst:30,
    split:310, lifetime:170, dot:15, zone:25, bounce:130, burn:10, freeze:190, shock:260,
    lifesteal:330, knockback:45, seal:275, charm:315, drone:160, striker:95 };
  let tw = 0, hs = 0;
  for (const k of Object.keys(pts)) { if (pts[k] > 0) { hs += hueMap[k] * pts[k]; tw += pts[k]; } }
  if (!tw) return '#aaccff';
  return G.hslToHex(Math.round(hs / tw), 75 + Math.min(tw, 15), 60);
};
G.hslToHex = function(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h/30) % 12; return Math.round(255 * (l - a * Math.max(Math.min(k-3, 9-k, 1), -1))).toString(16).padStart(2,'0'); };
  return `#${f(0)}${f(8)}${f(4)}`;
};

// ═══════════════ 子弹形态 ═══════════════
G.computeBulletShape = function(pts) {
  const keys = Object.keys(pts);
  const total = keys.reduce((s, k) => s + pts[k], 0) || 1;
  const weights = {}; for (const k of keys) weights[k] = pts[k] / total;
  const shapeMap = { power:'orb', rate:'streak', pierce:'needle', homing:'crescent',
    burst:'cluster', split:'cluster', lifetime:'dart', dot:'orb', zone:'star', bounce:'dart',
    burn:'star', freeze:'needle', shock:'streak', drone:'cluster' };
  const sorted = keys.map(k => ({ key: k, w: weights[k] })).sort((a, b) => b.w - a.w);
  const d = sorted[0];
  return { primary: shapeMap[d.key]||'orb', secondary: sorted.length>1?(shapeMap[sorted[1].key]||'orb'):'orb',
    blend: sorted.length>1 ? sorted[1].w/(d.w+0.01) : 0, intensity: d.w };
};

// ═══════════════ 飞船外观 ═══════════════
G.computeShipVisual = function(pts) {
  const total = pts.hull + pts.regen + pts.reflect + pts.shield + (pts.reactive || 0) + (pts.guard || 0);
  const hueMap = { hull: 0, regen: 120, reflect: 30, shield: 210, reactive: 45, guard: 180 };
  let tw = 0, hs = 0;
  for (const k of Object.keys(pts)) { if (pts[k] > 0 && hueMap[k] !== undefined) { hs += hueMap[k] * pts[k]; tw += pts[k]; } }
  const hue = tw > 0 ? Math.round(hs / tw) : 210;
  return {
    scale: 1 + total * 0.015,
    hue: hue,
    hasShield: pts.shield > 0,
    hasSpikes: pts.reflect > 0,
    hasAura: pts.regen > 2,
    color: G.hslToHex(hue, 70, 55),
  };
};

// ═══════════════ 武器系统 ═══════════════
G.WeaponSystem = class WeaponSystem {
  constructor(bulletPool, events, particles) {
    this.bulletPool = bulletPool; this.events = events; this.particles = particles;
    this.weapon = null;
    this.aoeBlasts = []; this.blackholes = []; this.chainLightnings = [];
    this.damageZones = []; this.orbitalBullets = [];
  }
  setWeapon(w) { this.weapon = w; }

  fire(player, mx, my) {
    const w = this.weapon; if (!w) return;
    const baseAngle = G.angle(player.x, player.y, mx, my);
    this.fireVolley(player.x + Math.cos(baseAngle) * 26, player.y + Math.sin(baseAngle) * 26, baseAngle, player);
  }

  // 唯一子弹参数来源：武器全属性+基因加成（反应装甲/主射击/无人机共用，杜绝字段分叉）
  // dmgMult：伤害倍率（反应装甲为0.5）；封印/魅惑/叠加态等累计字段原样继承
  bulletSpec(x, y, angle, dmgMult = 1) {
    const w = this.weapon;
    const geneDamage = w.damage * dmgMult * (G.hasGene('normal') ? 1.2 : 1);
    const geneSplit = w.split + (G.hasGene('splitter') ? 2 : 0);
    return {
      x, y,
      vx: Math.cos(angle) * w.bulletSpeed, vy: Math.sin(angle) * w.bulletSpeed,
      angle, speed: w.bulletSpeed, damage: geneDamage, radius: w.bulletRadius,
      penetration: w.penetration, homing: w.homing, aoe: 0, split: geneSplit,
      color: w.color, trailColor: w.trailColor, bulletShape: w.bulletShape,
      maxLife: w.maxLife, owner: 'player', isChild: false,
      bounce: w.bounce > 0, bounceMax: w.bounce,
      dot: w.dot, zoneRadius: w.zoneRadius, zoneDps: 0,
      burnDps: w.burnDps, freezePower: w.freezePower, shockPoints: w.shockPoints,
      lifesteal: w.lifesteal, knockback: w.knockback,
      sealRatio: w.sealRatio, charmRatio: w.charmRatio,
      geneTime: w.geneTime, charmHeal: w.charmHeal,
      superAccumRatio: w.superAccumRatio, superCharmTime: w.superCharmTime, superGeneTime: w.superGeneTime,
    };
  }

  // 从指定位置/角度发射一轮齐射（burst颗），主射击/无人机/反应装甲共用的唯一发射路径
  // dmgMult：伤害倍率（反应装甲为0.5）；子弹参数统一由 bulletSpec 生成
  fireVolley(x, y, angle, src, dmgMult = 1) {
    const w = this.weapon; if (!w) return;
    const n = w.burst || 1;
    for (let b = 0; b < n; b++) {
      let a;
      if (n > 1) a = angle - w.spread + (b / (n - 1)) * w.spread * 2;
      else a = angle + (G.RAND() - 0.5) * w.spread * 2;
      const bullet = this.bulletPool.get();
      bullet.init(this.bulletSpec(x, y, a, dmgMult));
      this.events.emit('weapon:fire', { bullet });
      if (src) this.particles.emit(x, y, {
        count: 3, speedMin: 30, speedMax: 80, lifeMin: 0.05, lifeMax: 0.15,
        radiusMin: 1, radiusMax: 2, color: w.color, angle: angle + Math.PI, angleSpread: 0.5 });
    }
  }

  // 反应装甲：受击时触发 count 次反应，每次从受伤部位向伤害源发射一整轮武器齐射
  // 点数=反应次数（非弹数）；齐射完整继承弹数(burst)与全部词条，伤害减半
  fireReactive(player, angle, count) {
    const w = this.weapon; if (!w) return;
    const x = player.x + Math.cos(angle) * player.radius;
    const y = player.y + Math.sin(angle) * player.radius;
    for (let i = 0; i < count; i++) {
      const a = angle + (count > 1 ? (i / (count - 1) - 0.5) * 0.4 : 0);
      this.fireVolley(x, y, a, null, 0.5);
    }
    this.particles.emit(player.x + Math.cos(angle) * player.radius, player.y + Math.sin(angle) * player.radius, {
      count: 6, speedMin: 40, speedMax: 120, lifeMin: 0.1, lifeMax: 0.25,
      radiusMin: 1, radiusMax: 2, color: '#fd4', angle: angle, angleSpread: 1.0 });
  }

  handleBulletHit(bullet, enemy) {
    if (bullet.hitEnemies.has(enemy) && !bullet.pierceAll) return false;
    // 反射者：正面减伤
    if (enemy.traits.includes('reflector')) {
      const angToBullet = G.angle(enemy.x, enemy.y, bullet.x, bullet.y);
      const diff = Math.abs(G.angleDiff(enemy.facingAngle || 0, angToBullet));
      if (diff < Math.PI * 0.4) { bullet.damage *= 0.3; } // 正面仅30%伤害
    }
    // 相位中不可命中
    if (enemy.phaseShift > 0) return false;

    let dmg = bullet.damage;
    let killed = false;

    if (bullet.superAccumRatio > 0 && !enemy.charmed && !enemy.traits.includes('boss')) {
      // 叠加态子弹（魅惑+封印同加点）：合并累计，满值先临时魅惑、到期后封印夺基因
      enemy.hitFlash = 1;
      this.events.emit('enemy:hit', { enemy, damage: 0 });
      enemy.bubbleGrow();
      enemy.superAccum = (enemy.superAccum || 0) + bullet.damage * bullet.superAccumRatio;
      if (enemy.superAccum >= enemy.maxHp) {
        enemy.convertToAlly(bullet.charmHeal || 0);
        enemy.superTimer = bullet.superCharmTime;      // 临时魅惑时长 = 20×魅惑点数×魅惑比例
        enemy.superGeneTime = bullet.superGeneTime;    // 封印后基因时长 = 10×封印点数×封印比例
        this.events.emit('enemy:charmed', { enemy });
        this.particles.explosion(enemy.x, enemy.y, '#d8aff', enemy.radius * 1.5);
      }
    } else if (bullet.charmRatio > 0 && !enemy.charmed) {
      // 魅惑子弹：不造成伤害，仅累计魅惑值，达到敌人血量转化为友军（Boss也可魅惑；点数提供友军回血）
      enemy.hitFlash = 1;
      this.events.emit('enemy:hit', { enemy, damage: 0 });
      enemy.bubbleGrow(); // 魅惑命中同样触发泡泡变大
      enemy.charmAccum = (enemy.charmAccum || 0) + bullet.damage * bullet.charmRatio; // 每命中累计子弹伤害的10%
      if (enemy.charmAccum >= enemy.maxHp) {
        enemy.convertToAlly(bullet.charmHeal || 0);
        this.events.emit('enemy:charmed', { enemy });
        this.particles.explosion(enemy.x, enemy.y, '#f6c', enemy.radius * 1.5);
      }
    } else if (bullet.sealRatio > 0 && !enemy.traits.includes('boss')) {
      // 封印子弹：不造成伤害，累计封印值；满值吸收目标并夺取其基因能力
      enemy.hitFlash = 1;
      this.events.emit('enemy:hit', { enemy, damage: 0 });
      enemy.bubbleGrow(); // 封印命中同样触发泡泡变大
      enemy.sealAccum = (enemy.sealAccum || 0) + bullet.damage * bullet.sealRatio; // 每命中累计子弹伤害的30%
      if (enemy.sealAccum >= enemy.maxHp) {
        const trait = enemy.traits[0] || 'normal';
        enemy.absorb(this.events); // 吸收：静默击杀，绕过时间溜脱/复活/自爆/分裂
        killed = true;
        this.particles.explosion(enemy.x, enemy.y, '#a6f', enemy.radius * 1.5);
        G.gainGene(trait, bullet.geneTime, enemy.x, enemy.y); // 夺取基因：每封印点10秒
      }
    } else {
      killed = enemy.takeDamage(dmg, this.events);
    }
    this.particles.hitSpark(bullet.x, bullet.y, bullet.color);

    // 吸血：命中吸取血量
    if (bullet.lifesteal > 0 && G.player && G.player.alive) {
      const heal = Math.min(bullet.lifesteal, G.player.maxHp - G.player.hp);
      if (heal > 0) {
        G.player.hp += heal;
        this.events.emit('player:lifesteal', { amount: heal, x: enemy.x, y: enemy.y });
      }
    }
    // 击退：远离玩家
    if (bullet.knockback > 0 && enemy.alive) {
      const ang = G.angle(G.player.x, G.player.y, enemy.x, enemy.y);
      enemy.x += Math.cos(ang) * bullet.knockback * 0.5;
      enemy.y += Math.sin(ang) * bullet.knockback * 0.5;
      enemy.vx += Math.cos(ang) * bullet.knockback * 4;
      enemy.vy += Math.sin(ang) * bullet.knockback * 4;
    }

    // 慢性毒药：固定4/秒，点数增加持续时间，伤害不增加
    if (bullet.dot > 0 && enemy.alive) {
      enemy.applyDOT(4, bullet.dot);
    }
    // 燃烧：伤害随时间递增，重复命中不叠加
    if (bullet.burnDps > 0 && enemy.alive) {
      enemy.applyBurn(bullet.burnDps, 3);
    }
    // 冰冻：命中必叠加（叠加值=减速%，满100%冰冻）
    if (bullet.freezePower > 0 && enemy.alive) {
      enemy.applyFreeze(bullet.freezePower);
    }
    // 感电：命中必触发连锁闪电（跳数=点数，每跳伤害+减速）
    if (bullet.shockPoints > 0 && enemy.alive) {
      this.chainShock(enemy, bullet.damage, bullet.shockPoints);
    }

    // 分裂
    if (bullet.split > 0 && !bullet.isChild) this.splitBullet(bullet);

    // 区域AOE：命中后产生持续区域，继承武器全部属性
    if (bullet.zoneRadius > 0) {
      const remainingLife = Math.max(0.5, bullet.maxLife - bullet.life);
      this.createAOE(bullet.x, bullet.y, bullet.zoneRadius, bullet.damage, bullet.color, {
        persistent: true, maxLife: remainingLife,
        dot: bullet.dot, burnDps: bullet.burnDps,
        freezePower: bullet.freezePower, shockPoints: bullet.shockPoints,
        homing: bullet.homing, penetration: bullet.penetration,
        bounce: bullet.bounce, bounceMax: bullet.bounceMax,
        lifesteal: bullet.lifesteal, knockback: bullet.knockback,
        sealRatio: bullet.sealRatio, charmRatio: bullet.charmRatio,
        geneTime: bullet.geneTime, charmHeal: bullet.charmHeal,
        superAccumRatio: bullet.superAccumRatio, superCharmTime: bullet.superCharmTime, superGeneTime: bullet.superGeneTime,
        vx: bullet.vx * 0.3, vy: bullet.vy * 0.3, speed: bullet.speed * 0.3,
      });
    }

    // 弹射
    if (bullet.bounceCount < (bullet.bounceMax || 0) && !killed) {
      let nearest = null, nd = 250;
      const enemies = G.enemyPool.active;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (!e.alive || e === enemy || bullet.hitEnemies.has(e)) continue;
        const d = G.dist(bullet.x, bullet.y, e.x, e.y);
        if (d < nd) { nd = d; nearest = e; }
      }
      if (nearest) {
        const a = G.angle(bullet.x, bullet.y, nearest.x, nearest.y);
        bullet.vx = Math.cos(a) * bullet.speed; bullet.vy = Math.sin(a) * bullet.speed;
        bullet.angle = a; bullet.bounceCount++;
        bullet.hitEnemies.delete(enemy);
        return killed;
      }
    }

    // 穿透
    if (bullet.pierceCount < bullet.penetration) {
      bullet.pierceCount++; bullet.hitEnemies.add(enemy);
    } else { bullet.alive = false; }
    return killed;
  }

  // 感电连锁：从命中目标起向160px内最近敌人跳跃，跳数=感电点数；每跳40%子弹伤害（逐跳衰减20%）并施加3秒50%减速
  chainShock(start, damage, points) {
    start.applyShock();
    G.particles.hitSpark(start.x, start.y, '#ff0');
    const hitSet = new Set([start]);
    let cur = start;
    const hops = Math.min(points, 8);
    for (let i = 0; i < hops; i++) {
      let next = null, nd = 160 * 160;
      const act = G.enemyPool.active;
      for (let j = 0; j < act.length; j++) {
        const e = act[j];
        if (!e.alive || e.charmed || e.phaseShift > 0 || hitSet.has(e)) continue;
        const d2 = (e.x - cur.x) * (e.x - cur.x) + (e.y - cur.y) * (e.y - cur.y);
        if (d2 < nd) { nd = d2; next = e; }
      }
      if (!next) break;
      G.particles.lightning(cur.x, cur.y, next.x, next.y, '#ff0');
      next.takeDamage(damage * 0.4 * Math.pow(0.8, i), G.events);
      next.applyShock();
      hitSet.add(next);
      cur = next;
    }
  }

  createAOE(x, y, radius, damage, color, extra) {
    const config = { x, y, radius, damage, color: color || '#f84', maxLife: 0.3, persistent: false, ...extra };
    this.aoeBlasts.push(new G.AOEBlast(config));
    this.particles.explosion(x, y, color || '#f84', radius * 0.5);
  }

  splitBullet(parent) {
    for (let i = 0; i < parent.split; i++) {
      const a = parent.angle + ((i + 0.5) / parent.split - 0.5) * Math.PI * 0.6;
      const child = this.bulletPool.get();
      child.init({
        x: parent.x, y: parent.y, vx: Math.cos(a)*parent.speed*0.8, vy: Math.sin(a)*parent.speed*0.8,
        angle: a, speed: parent.speed*0.8, damage: parent.damage*0.5, radius: parent.radius*0.7,
        penetration: 0, homing: parent.homing*0.5, aoe: 0, split: 0,
        color: parent.color, trailColor: parent.trailColor, bulletShape: parent.bulletShape,
        maxLife: 1.5, owner: 'player', isChild: true, dot: parent.dot*0.5,
        bounce: false, bounceMax: 0, zoneRadius: 0, zoneDps: 0,
        burnDps: parent.burnDps*0.5, freezePower: parent.freezePower*0.5, shockPoints: Math.ceil(parent.shockPoints*0.5),
        lifesteal: parent.lifesteal*0.5, knockback: parent.knockback*0.5,
        sealRatio: 0, charmRatio: 0,
      });
    }
  }

  update(dt, enemies, player) {
    // AOE区域
    for (let i = this.aoeBlasts.length - 1; i >= 0; i--) {
      const b = this.aoeBlasts[i];
      b.update(dt, b.persistent ? enemies : null, b.persistent ? this.events : null);
      // 非持续AOE（瞬爆）：外部碰撞检测
      if (!b.persistent) {
        for (const e of enemies) {
          if (!e.alive || b.hitEnemies.has(e) || e.phaseShift > 0) continue;
          if (G.dist(b.x, b.y, e.x, e.y) < b.radius + e.radius) {
            e.takeDamage(b.damage, this.events); b.hitEnemies.add(e);
          }
        }
      }
      if (!b.alive) this.aoeBlasts.splice(i, 1);
    }
    // 持续伤害处理（无视相位）：慢性毒药固定dps；燃烧dps随燃烧时长增长，伤害不叠加
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.dotDamage > 0 && e.dotTimer > 0) {
        e.dotTimer -= dt;
        e.hp -= e.dotDamage * dt;
        if (e.hp <= 0) { e.alive = false; this.events.emit('enemy:death', { enemy: e }); }
      }
      if (!e.alive) continue;
      if (e.burnTimer > 0) {
        e.burnTimer -= dt; e.burnAge += dt;
        e.hp -= e.burnDps * Math.min(6, 1 + e.burnAge) * dt;
        if (e.hp <= 0) { e.alive = false; this.events.emit('enemy:death', { enemy: e }); }
      } else if (e.burnDps > 0) { e.burnDps = 0; e.burnAge = 0; }
    }
    // 轨道弹
    if (player) {
      for (let i = 0; i < this.orbitalBullets.length; i++) {
        const ob = this.orbitalBullets[i];
        ob.angle += ob.speed * dt;
        ob.x = player.x + Math.cos(ob.angle) * ob.dist;
        ob.y = player.y + Math.sin(ob.angle) * ob.dist;
        for (const e of enemies) {
          if (!e.alive || e.phaseShift > 0) continue;
          if (G.dist(ob.x, ob.y, e.x, e.y) < ob.radius + e.radius) {
            if (!ob.hitCooldown.has(e) || ob.hitCooldown.get(e) <= 0) {
              e.takeDamage(ob.damage, this.events);
              ob.hitCooldown.set(e, 0.3);
            }
          }
        }
        // 更新冷却
        for (const [k, v] of ob.hitCooldown) {
          ob.hitCooldown.set(k, v - dt);
          if (v <= 0) ob.hitCooldown.delete(k);
        }
      }
    }
    for (let i = this.blackholes.length - 1; i >= 0; i--) {
      this.blackholes[i].update(dt, enemies);
      if (!this.blackholes[i].alive) this.blackholes.splice(i, 1);
    }
    for (let i = this.chainLightnings.length - 1; i >= 0; i--) {
      this.chainLightnings[i].update(dt);
      if (!this.chainLightnings[i].alive) this.chainLightnings.splice(i, 1);
    }
  }

  drawEffects(ctx, time) {
    for (const b of this.aoeBlasts) b.draw(ctx, time);
    for (const b of this.blackholes) b.draw(ctx, time);
    for (const c of this.chainLightnings) c.draw(ctx);
    for (const ob of this.orbitalBullets) ob.draw(ctx, time);
  }
};

// ═══════════════ 绘制子弹形态 ═══════════════
G.drawBulletShape = function(ctx, x, y, angle, radius, shape, color, time) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  const r = radius, blend = shape.blend || 0, intensity = shape.intensity || 0.5;
  ctx.fillStyle = color;

  switch (shape.primary) {
    case 'crescent': {
      ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI*0.7, Math.PI*0.7);
      ctx.arc(r*0.3, 0, r*(0.5+blend*0.2), Math.PI*0.6, -Math.PI*0.6, true);
      ctx.closePath(); ctx.fill(); break;
    }
    case 'needle': {
      const len = r*(2+intensity*2);
      ctx.beginPath(); ctx.moveTo(len, 0); ctx.lineTo(-len*0.3, -r*0.4);
      ctx.lineTo(-len*0.5, 0); ctx.lineTo(-len*0.3, r*0.4); ctx.closePath(); ctx.fill(); break;
    }
    case 'star': {
      const spikes = 5, oR = r*(1.2+intensity*0.5), iR = r*0.4;
      ctx.beginPath();
      for (let i = 0; i < spikes*2; i++) {
        const a = (i/(spikes*2))*G.TWO_PI - Math.PI/2, cr = i%2===0 ? oR : iR;
        i === 0 ? ctx.moveTo(Math.cos(a)*cr, Math.sin(a)*cr) : ctx.lineTo(Math.cos(a)*cr, Math.sin(a)*cr);
      }
      ctx.closePath(); ctx.fill(); break;
    }
    case 'cluster': {
      const cnt = 3+Math.floor(intensity*2);
      for (let i = 0; i < cnt; i++) {
        const a = (i/cnt)*G.TWO_PI, d = r*0.6;
        ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, r*0.45, 0, G.TWO_PI); ctx.fill();
      } break;
    }
    case 'streak': {
      const len = r*(2+intensity*3);
      ctx.beginPath(); ctx.ellipse(0, 0, len, r*0.5, 0, 0, G.TWO_PI); ctx.fill(); break;
    }
    case 'dart': {
      const len = r*(1.5+intensity*1.5);
      ctx.beginPath(); ctx.moveTo(len, 0); ctx.lineTo(-r*0.5, -r*0.8);
      ctx.lineTo(-r*0.2, 0); ctx.lineTo(-r*0.5, r*0.8); ctx.closePath(); ctx.fill(); break;
    }
    default: {
      ctx.beginPath(); ctx.arc(0, 0, r*(1+intensity*0.5), 0, G.TWO_PI); ctx.fill();
    }
  }
  ctx.restore();
};

// ═══════════════════════════════════════════════════════
// waves.js — 波次管理 / 敌人生成 / 难度曲线
// ═══════════════════════════════════════════════════════
// (G = window.Game)
G.WaveManager = class WaveManager {
  constructor(enemyPool, events) {
    this.enemyPool = enemyPool;
    this.events = events;
    this.currentWave = 0;
    this.waveTimer = 0;
    this.spawnQueue = [];
    this.spawnTimer = 0;
    this.waveActive = false;
    this.betweenWaves = true;
    this.betweenTimer = 2; // 波间休息
    this.totalEnemiesInWave = 0;
    this.killedInWave = 0;
  }

  startNextWave() {
    this.currentWave++;
    this.waveActive = true;
    this.betweenWaves = false;
    this.killedInWave = 0;
    this.spawnQueue = this._generateWave(this.currentWave);
    this.totalEnemiesInWave = this.spawnQueue.length;
    this.spawnTimer = 0;

    this.events.emit('wave:start', {
      wave: this.currentWave,
      enemyCount: this.totalEnemiesInWave,
    });
  }

  _generateWave(wave) {
    const queue = [];
    const w = wave;

    // 基础敌人数量随波次增长
    const normalCount = 3 + Math.floor(w * 1.5);
    for (let i = 0; i < normalCount; i++) {
      queue.push({ type: G.EnemyType.NORMAL, delay: 0.4 });
    }

    // 第2波开始加入快速敌人
    if (w >= 2) {
      const fastCount = Math.floor(w * 0.8);
      for (let i = 0; i < fastCount; i++) {
        queue.push({ type: G.EnemyType.FAST, delay: 0.3 });
      }
    }

    // 第3波开始加入坦克
    if (w >= 3) {
      const tankCount = Math.max(1, Math.floor(w * 0.3));
      for (let i = 0; i < tankCount; i++) {
        queue.push({ type: G.EnemyType.TANK, delay: 1.0 });
      }
    }

    // 第4波开始加入自愈者
    if (w >= 4) {
      const healerCount = Math.max(1, Math.floor((w - 3) * 0.5));
      for (let i = 0; i < healerCount; i++) {
        queue.push({ type: G.EnemyType.HEALER, delay: 0.8 });
      }
    }

    // 第5波开始加入分裂者
    if (w >= 5) {
      const splitCount = Math.max(1, Math.floor((w - 4) * 0.4));
      for (let i = 0; i < splitCount; i++) {
        queue.push({ type: G.EnemyType.SPLITTER, delay: 0.6 });
      }
    }

    // 第6波开始加入护盾敌人
    if (w >= 6) {
      const shieldCount = Math.max(1, Math.floor((w - 5) * 0.4));
      for (let i = 0; i < shieldCount; i++) {
        queue.push({ type: G.EnemyType.SHIELDED, delay: 0.7 });
      }
    }

    // 第4波开始加入爆炸者
    if (w >= 4) {
      const expCount = Math.max(1, Math.floor((w - 3) * 0.5));
      for (let i = 0; i < expCount; i++) {
        queue.push({ type: G.EnemyType.EXPLOSIVE, delay: 0.4 });
      }
    }

    // 第7波开始加入传送者
    if (w >= 7) {
      const teleCount = Math.max(1, Math.floor((w - 6) * 0.4));
      for (let i = 0; i < teleCount; i++) {
        queue.push({ type: G.EnemyType.TELEPORTER, delay: 0.5 });
      }
    }

    // 第3波开始加入相位者
    if (w >= 3) {
      const phaseCount = Math.max(1, Math.floor((w - 2) * 0.4));
      for (let i = 0; i < phaseCount; i++) {
        queue.push({ type: G.EnemyType.PHASER, delay: 0.7 });
      }
    }

    // 第6波开始加入反射者
    if (w >= 6) {
      const refCount = Math.max(1, Math.floor((w - 5) * 0.3));
      for (let i = 0; i < refCount; i++) {
        queue.push({ type: G.EnemyType.REFLECTOR, delay: 0.8 });
      }
    }

    // 第2波开始加入蜂群
    if (w >= 2) {
      const swarmCount = Math.floor(w * 0.6);
      for (let i = 0; i < swarmCount; i++) {
        queue.push({ type: G.EnemyType.SWARM, delay: 0.2 });
      }
    }

    // 第4波开始加入泡泡（越打越大越脆弱）
    if (w >= 4) {
      const bubbleCount = Math.max(1, Math.floor((w - 3) * 0.4));
      for (let i = 0; i < bubbleCount; i++) {
        queue.push({ type: G.EnemyType.BUBBLE, delay: 0.6 });
      }
    }

    // 第5波开始加入复活者（首次死亡后复活）
    if (w >= 5) {
      const reviverCount = Math.max(1, Math.floor((w - 4) * 0.3));
      for (let i = 0; i < reviverCount; i++) {
        queue.push({ type: G.EnemyType.REVIVER, delay: 1.0 });
      }
    }

    // 第7波开始加入时间溜脱者（伤害延迟释放）
    if (w >= 7) {
      const lurkerCount = Math.max(1, Math.floor((w - 6) * 0.3));
      for (let i = 0; i < lurkerCount; i++) {
        queue.push({ type: G.EnemyType.TIMELURKER, delay: 0.9 });
      }
    }

    // 第4波开始加入育母之巢（无法移动，每5秒召唤敌人）
    if (w >= 4) {
      const nestCount = Math.max(1, Math.floor((w - 3) * 0.3));
      for (let i = 0; i < nestCount; i++) {
        queue.push({ type: G.EnemyType.NEST, delay: 1.5 });
      }
    }

    // 精英词缀（第5波后概率增加）
    const eliteChance = Math.min(0.3, (w - 4) * 0.05);
    for (const item of queue) {
      if (item.type === G.EnemyType.BOSS || item.type === G.EnemyType.SWARM || item.type === G.EnemyType.NEST) continue;
      if (Math.random() < eliteChance) {
        const types = ['speed', 'shield', 'aura'];
        item.elite = { type: types[Math.floor(Math.random() * types.length)] };
      }
    }

    // 每5波出Boss
    if (w % 5 === 0) {
      queue.push({ type: G.EnemyType.BOSS, delay: 2.0 });
    }

    // 打乱顺序（但Boss总在最后）
    const boss = queue.filter(q => q.type === G.EnemyType.BOSS);
    const others = queue.filter(q => q.type !== G.EnemyType.BOSS);
    for (let i = others.length - 1; i > 0; i--) {
      const j = Math.floor(G.RAND() * (i + 1));
      [others[i], others[j]] = [others[j], others[i]];
    }

    return [...others, ...boss];
  }

  _spawnEnemy(type, elite) {
    const enemy = this.enemyPool.get();
    const w = G.renderer.width, h = G.renderer.height, margin = 50;
    if (type === G.EnemyType.NEST) {
      // 育母之巢无法移动，直接出生在场地内部
      const x = G.randFloat(w * 0.25, w * 0.75);
      const y = G.randFloat(h * 0.25, h * 0.75);
      enemy.init(type, x, y, this.currentWave, elite);
    } else {
      const side = G.randInt(0, 3);
      let x, y;
      switch (side) {
        case 0: x = G.randFloat(-margin, w + margin); y = -margin; break;
        case 1: x = w + margin; y = G.randFloat(-margin, h + margin); break;
        case 2: x = G.randFloat(-margin, w + margin); y = h + margin; break;
        case 3: x = -margin; y = G.randFloat(-margin, h + margin); break;
      }
      enemy.init(type, x, y, this.currentWave, elite);
    }
    this.events.emit('enemy:spawn', { enemy });
    return enemy;
  }

  // 育母之巢召唤：每5秒在巢边生成基础敌人（被魅惑的巢召唤友军后代）
  summonFromNest(nest) {
    if (!nest || !nest.alive) return;
    const types = [G.EnemyType.NORMAL, G.EnemyType.FAST, G.EnemyType.SWARM];
    const type = types[Math.floor(G.RAND() * types.length)];
    const child = this.enemyPool.get();
    const a = G.RAND() * G.TWO_PI;
    child.init(type,
      G.clamp(nest.x + Math.cos(a) * (nest.radius + 14), 20, G.renderer.width - 20),
      G.clamp(nest.y + Math.sin(a) * (nest.radius + 14), 20, G.renderer.height - 20),
      this.currentWave);
    if (nest.charmed) child.convertToAlly();
    this.events.emit('enemy:spawn', { enemy: child });
  }

  // 分裂者死亡时生成小分裂体（charmedParent=true 时生成魅惑友军后代）
  spawnSplits(parentEnemy, charmedParent = false) {
    for (let i = 0; i < parentEnemy.splitCount; i++) {
      const child = this.enemyPool.get();
      const angle = (i / parentEnemy.splitCount) * G.TWO_PI;
      const dist = parentEnemy.radius + 10;
      child.init(G.EnemyType.NORMAL,
        parentEnemy.x + Math.cos(angle) * dist,
        parentEnemy.y + Math.sin(angle) * dist,
        this.currentWave
      );
      child.radius = 10;
      child.maxHp = child.hp = Math.floor(parentEnemy.maxHp * 0.2);
      child.speed = parentEnemy.speed * 1.5;
      child.color = '#c4c';
      child.scoreValue = 5;
      if (charmedParent) { child.convertToAlly(); }
    }
  }

  update(dt) {
    if (this.betweenWaves) {
      if (this.pauseBetweenWaves) return; // 等待玩家加点
      this.betweenTimer -= dt;
      if (this.betweenTimer <= 0) {
        this.startNextWave();
      }
      return;
    }

    if (!this.waveActive) return;

    // 生成队列中的敌人
    if (this.spawnQueue.length > 0) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        const next = this.spawnQueue.shift();
        this._spawnEnemy(next.type, next.elite);
        this.spawnTimer = next.delay || 0.5;
      }
    }

    // 检查波次是否结束（魅惑的敌人算作队友，不阻塞过关）
    if (this.spawnQueue.length === 0) {
      let hostiles = 0;
      const act = this.enemyPool.active;
      for (let i = 0; i < act.length; i++) { if (act[i].alive && !act[i].charmed) hostiles++; }
      if (hostiles === 0) {
        this.waveActive = false;
        this.betweenWaves = true;
        this.betweenTimer = 3;
        this.events.emit('wave:complete', { wave: this.currentWave });
      }
    }
  }

  onEnemyKilled() {
    this.killedInWave++;
  }
};

// playfun.js — Play.fun (OpenGameProtocol) SDK 集成
// ═══════════════════════════════════════════
// (G = window.Game)
// Play.fun Browser SDK：游玩中累计积分 addPoints()，游戏结束 endGame() 提交。
// 防御式设计：SDK 未加载（广告拦截/离线/本地双击打开）时保持 no-op，游戏照常运行。
G.playfun = {
  sdk: null,
  ready: false,
  addPoints() {},
  endGame() {},
};

(function initPlayFun() {
  if (typeof OpenGameSDK === 'undefined') return;
  try {
    const sdk = new OpenGameSDK({ ui: { usePointsWidget: true }, logLevel: 'info' });
    G.playfun.sdk = sdk;
    sdk.on('OnReady', () => { G.playfun.ready = true; });
    // SDK 弹出模态框（登录/结算）时暂停、关闭后恢复
    sdk.on('GamePause', () => { if (G.gameData) G.gameData.paused = true; });
    sdk.on('GameResume', () => { if (G.gameData) G.gameData.paused = false; });
    sdk.init({ gameId: '8f2a7e71-987d-46e0-812f-607f1b55b8dd' });
    G.playfun.addPoints = function (n) {
      if (G.playfun.ready && n > 0) { try { sdk.addPoints(n); } catch (e) {} }
    };
    G.playfun.endGame = async function () {
      if (G.playfun.ready) { try { await sdk.endGame(); } catch (e) {} }
    };
  } catch (e) {
    console.warn('Play.fun SDK init failed:', e);
  }
})();

// ═══════════════════════════════════════════════════════
// (G = window.Game)
// ═══════════════ 初始化 ═══════════════
const canvas = document.getElementById('gameCanvas');
G.renderer = new G.Renderer(canvas);
G.input = new G.Input(canvas);
G.events = new G.EventBus();
G.shake = new G.ScreenShake();
G.hitStop = new G.HitStop();

G.bulletPool = new G.Pool(() => new G.Bullet(), (b) => b.reset(), 200);
G.enemyPool = new G.Pool(() => new G.Enemy(), (e) => e.reset(), 100);

G.particles = new G.ParticleSystem(800);
G.weaponSystem = new G.WeaponSystem(G.bulletPool, G.events, G.particles);
G.waveManager = new G.WaveManager(G.enemyPool, G.events);
G.gameLoop = new G.GameLoop();

G.player = null;

// ═══════════════ 连杀系统 ═══════════════
G.combo = { count: 0, timer: 0, maxTime: 2, multiplier: 1 };

function updateCombo(dt) {
  if (G.combo.timer > 0) {
    G.combo.timer -= dt;
    if (G.combo.timer <= 0) { G.combo.count = 0; G.combo.multiplier = 1; }
  }
}
function addCombo() {
  G.combo.count++;
  G.combo.timer = G.combo.maxTime;
  G.combo.multiplier = 1 + Math.floor(G.combo.count / 3) * 0.5;
  if (G.combo.multiplier > 5) G.combo.multiplier = 5;
}

// ═══════════════ 伤害数字 ═══════════════
const damageLayer = document.getElementById('damage-layer');
function showDamageNumber(x, y, amount, type = '') {
  const el = document.createElement('div');
  el.className = `dmg-num ${type}`;
  el.textContent = typeof amount === 'string' ? amount : Math.ceil(amount);
  el.style.left = `${x + (Math.random() - 0.5) * 20}px`;
  el.style.top = `${y - 10}px`;
  damageLayer.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

// ═══════════════ 事件监听 ═══════════════
G.events.on('enemy:death', (data) => {
  const e = data.enemy;
  // 魅惑友军阵亡：不计分，但分裂/自爆技能照常（作用于敌方）
  if (e.charmed) {
    G.particles.deathBurst(e.x, e.y, '#6f8', e.radius);
    if (e.traits.includes('splitter') && e.splitCount > 0) G.waveManager.spawnSplits(e, true);
    if (e.traits.includes('explosive')) {
      G.particles.explosion(e.x, e.y, '#6f8', 60);
      const act = G.enemyPool.active;
      for (let i = 0; i < act.length; i++) {
        const o = act[i];
        if (!o.alive || o.charmed || o === e) continue;
        if (G.dist(e.x, e.y, o.x, o.y) < 80) o.takeDamage(30, G.events, true);
      }
    }
    return;
  }
  addCombo();
  const scoreGain = Math.floor(e.scoreValue * G.combo.multiplier);
  G.gameData.score += scoreGain;
  G.playfun.addPoints(scoreGain);
  G.gameData.kills++;
  G.waveManager.onEnemyKilled();

  G.particles.deathBurst(e.x, e.y, e.color, e.radius);
  G.shake.trigger(4, 0.12);

  if (G.combo.count >= 3) {
    showDamageNumber(e.x, e.y - 20, `x${G.combo.multiplier} COMBO!`, 'crit');
    G.shake.trigger(6, 0.15);
  }

  if (e.absorbed) {
    // 封印吸收：静默死亡，不触发分裂/自爆
    showDamageNumber(e.x, e.y, scoreGain, 'crit');
    return;
  }

  if (e.traits.includes('splitter') && e.splitCount > 0) G.waveManager.spawnSplits(e);

  if (e.traits.includes('explosive')) {
    const d = G.dist(e.x, e.y, G.player.x, G.player.y);
    if (d < 80 && G.player.invincible <= 0) {
      G.player.takeDamage(30, G.events, e.x, e.y);
      G.shake.trigger(8, 0.2);
    }
    G.particles.explosion(e.x, e.y, '#f80', 60);
  }

  showDamageNumber(e.x, e.y, scoreGain, 'crit');
});

// 基因反应：受击时触发爆燃反击/闪现闪避
G.events.on('player:hit', (d) => {
  if (!(d.damage > 0) || !G.player || !G.player.alive) return;
  // 爆燃基因：受击反击周围敌人
  if (G.hasGene('explosive')) {
    const act = G.enemyPool.active;
    for (let i = 0; i < act.length; i++) {
      const e = act[i];
      if (!e.alive || e.charmed) continue;
      if (G.dist(G.player.x, G.player.y, e.x, e.y) < 80 + e.radius) e.takeDamage(30, G.events);
    }
    G.particles.explosion(G.player.x, G.player.y, '#f80', 50);
    G.shake.trigger(6, 0.15);
  }
  // 闪现基因：受击向移动方向瞬移150px
  if (G.hasGene('teleporter')) {
    const mv = G.input.movement;
    const a = (Math.abs(mv.x) + Math.abs(mv.y)) > 0 ? Math.atan2(mv.y, mv.x) : G.RAND() * G.TWO_PI;
    G.particles.explosion(G.player.x, G.player.y, '#a4f', 26);
    G.player.x = G.clamp(G.player.x + Math.cos(a) * 150, G.player.radius, G.renderer.width - G.player.radius);
    G.player.y = G.clamp(G.player.y + Math.sin(a) * 150, G.player.radius, G.renderer.height - G.player.radius);
    G.particles.explosion(G.player.x, G.player.y, '#a4f', 26);
  }
});

// ═══════════════ 碰撞检测 ═══════════════
function checkCollisions() {
  const bullets = G.bulletPool.active;
  const enemies = G.enemyPool.active;

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (!b.alive) continue;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (!e.alive || e.charmed || b.hitEnemies.has(e)) continue;
      if (e.phaseShift > 0) continue; // 相位中不可命中
      if (G.dist(b.x, b.y, e.x, e.y) < b.radius + e.radius) {
        G.weaponSystem.handleBulletHit(b, e);
        if (!b.alive) break;
      }
    }
  }

  // 敌人碰触玩家
  for (let j = 0; j < enemies.length; j++) {
    const e = enemies[j];
    if (!e.alive || e.charmed) continue;
    if (G.dist(e.x, e.y, G.player.x, G.player.y) < e.radius + G.player.radius) {
      const reflected = G.player.takeDamage(20, G.events, e.x, e.y);
      // 反伤
      if (reflected > 0 && e.alive) {
        e.takeDamage(reflected, G.events);
        showDamageNumber(e.x, e.y, reflected, 'heal');
      }
      // 棘壳基因：碰触玩家的敌人受伤
      if (G.hasGene('bubble') && e.alive) e.takeDamage(20, G.events);
      // 蜂群自爆
      if (e.traits.includes('swarm')) {
        e.alive = false;
        G.particles.explosion(e.x, e.y, e.color, 20);
        G.events.emit('enemy:death', { enemy: e });
      }
      const ang = G.angle(e.x, e.y, G.player.x, G.player.y);
      G.player.vx += Math.cos(ang) * 200;
      G.player.vy += Math.sin(ang) * 200;
    }
  }

  // 敌人碰触无人机：无人机受伤（死亡后由母船重生）
  for (let j = 0; j < enemies.length; j++) {
    const e = enemies[j];
    if (!e.alive || e.charmed) continue;
    for (let k = 0; k < G.drones.length; k++) {
      const dr = G.drones[k];
      if (!dr.alive) continue;
      if (G.dist(e.x, e.y, dr.x, dr.y) < e.radius + dr.radius) {
        dr.takeDamage(10, G.events);
        G.particles.hitSpark(dr.x, dr.y, '#6cf');
        // 无人机对敌接触伤害：方式与敌人碰玩家一致（20伤害+击退，蜂群自爆）
        if (dr.contactCd <= 0 && e.alive && !e.charmed && e.phaseShift <= 0) {
          dr.contactCd = 0.5;
          if (e.traits.includes('swarm')) {
            e.alive = false;
            G.particles.explosion(e.x, e.y, e.color, 20);
            G.events.emit('enemy:death', { enemy: e });
          } else {
            e.takeDamage(20, G.events);
          }
          const ang2 = G.angle(dr.x, dr.y, e.x, e.y);
          e.x += Math.cos(ang2) * 8; e.y += Math.sin(ang2) * 8;
          e.vx += Math.cos(ang2) * 80; e.vy += Math.sin(ang2) * 80;
          G.particles.hitSpark(e.x, e.y, '#9cf');
        }
      }
    }
  }

  // 敌人碰触防御无人机：防御机替母船抵挡伤害（反伤/反应装甲继承自母船，不可主动攻击）
  for (let j = 0; j < enemies.length; j++) {
    const e = enemies[j];
    if (!e.alive || e.charmed) continue;
    for (let k = 0; k < G.guards.length; k++) {
      const g = G.guards[k];
      if (!g.alive || g.contactCd > 0) continue;
      if (G.dist(e.x, e.y, g.x, g.y) < e.radius + g.radius) {
        g.contactCd = 0.5;
        const reflected = g.takeDamage(20, G.events, e.x, e.y); // 与敌碰母船一致的接触伤害
        if (reflected > 0 && e.alive) {
          e.takeDamage(reflected, G.events);
          showDamageNumber(e.x, e.y, reflected, 'heal');
        }
        // 防御机普通撞击伤害：与战斗无人机一致（20伤害，蜂群自爆）
        if (e.alive && !e.charmed && e.phaseShift <= 0) {
          if (e.traits.includes('swarm')) {
            e.alive = false;
            G.particles.explosion(e.x, e.y, e.color, 20);
            G.events.emit('enemy:death', { enemy: e });
          } else {
            e.takeDamage(20, G.events);
          }
          G.particles.hitSpark(e.x, e.y, '#9cf');
        }
        // 棘壳基因：碰触防御机的敌人同样受伤
        if (G.hasGene('bubble') && e.alive) e.takeDamage(20, G.events);
        // 蜂群自爆
        if (e.alive && e.traits.includes('swarm')) {
          e.alive = false;
          G.particles.explosion(e.x, e.y, e.color, 20);
          G.events.emit('enemy:death', { enemy: e });
        }
        // 敌人被弹开，避免贴身黏住
        if (e.alive) {
          const ang = G.angle(g.x, g.y, e.x, e.y);
          e.x += Math.cos(ang) * 8; e.y += Math.sin(ang) * 8;
          e.vx += Math.cos(ang) * 120; e.vy += Math.sin(ang) * 120;
        }
        G.particles.hitSpark(g.x, g.y, '#4dd');
      }
    }
  }

  // 敌人碰触进攻无人机：进攻机只受伤害，不对敌造成碰撞伤害；规避中（含冲锋自动规避）直接穿透，不发生碰撞
  for (let j = 0; j < enemies.length; j++) {
    const e = enemies[j];
    if (!e.alive || e.charmed) continue;
    for (let k = 0; k < G.strikers.length; k++) {
      const st = G.strikers[k];
      if (!st.alive) continue;
      if (G.dist(e.x, e.y, st.x, st.y) < e.radius + st.radius) {
        if (st.state === 'charge' || st.evadeTimer > 0) continue; // 规避中穿透敌人
        st.takeDamage(10, G.events);
        G.particles.hitSpark(st.x, st.y, '#f84');
      }
    }
  }

  // 魅惑友军碰触敌人：互相造成接触伤害
  for (let j = 0; j < enemies.length; j++) {
    const ally = enemies[j];
    if (!ally.alive || !ally.charmed || ally.allyHitCd > 0) continue;
    for (let k = 0; k < enemies.length; k++) {
      const foe = enemies[k];
      if (!foe.alive || foe.charmed || foe.phaseShift > 0) continue;
      if (G.dist(ally.x, ally.y, foe.x, foe.y) < ally.radius + foe.radius) {
        foe.takeDamage(20, G.events); // 与原敌人接触伤害一致
        // 相位中闪避反击；反射者正面减伤50%
        if (ally.phaseShift <= 0) {
          ally.takeDamage(ally.traits.includes('reflector') ? 10 : 20, G.events, true); // 敌方反击魅惑友军
        }
        ally.allyHitCd = 0.5;
        G.particles.hitSpark(foe.x, foe.y, '#6f8');
        break;
      }
    }
  }
}

// ═══════════════ 主循环 ═══════════════
function update(dt) {
  if (G.gameData.state !== G.State.PLAYING) return;
  if (G.gameData.paused) return;

  const timeScale = G.hitStop.update(dt);
  const scaledDt = dt * timeScale;

  G.player.update(scaledDt, G.input, G.events);
  G.geneUpdate(scaledDt); // 基因buff倒计时与相位基因触发
  G.updateDrones(scaledDt); // 无人机跟随准星并攻击
  G.updateGuards(scaledDt); // 防御无人机环绕护卫
  G.updateStrikers(scaledDt); // 进攻无人机冲锋攻击

  // 射击 — 使用唯一武器（狂暴基因：射速+30%；无人机/进攻无人机加点时关闭基础射击，由无人机代发）
  if (G.player.fireCooldown <= 0 && G.input.shooting && G.weaponSystem.weapon && G.weaponSystem.weapon.droneCount <= 0 && G.weaponSystem.weapon.strikerCount <= 0) {
    G.weaponSystem.fire(G.player, G.input.mouse.x, G.input.mouse.y);
    G.player.fireCooldown = 1 / G.weaponSystem.weapon.fireRate / (G.hasGene('swarm') ? 1.3 : 1);
  }

  G.enemyPool.update(scaledDt, (e, dt) => e.update(dt, G.player.x, G.player.y, G.events, G.enemyPool.active));
  G.bulletPool.update(scaledDt, (b, dt) => b.update(dt, G.enemyPool.active, G.events));
  G.weaponSystem.update(scaledDt, G.enemyPool.active, G.player);
  G.particles.update(scaledDt);
  updateCombo(dt);
  checkCollisions();
  G.waveManager.update(dt);
  G.shake.update(dt);
  updateHUD();
  G.input.endFrame();
}

function render(time) {
  const ctx = G.renderer.ctx;
  G.renderer.clear();
  G.renderer.applyShake(G.shake);
  G.renderer.drawBackground(time);

  if (G.gameData.state !== G.State.PLAYING && G.gameData.state !== G.State.GAMEOVER) return;

  G.weaponSystem.drawEffects(ctx, time);

  const enemies = G.enemyPool.active;
  for (let i = 0; i < enemies.length; i++) enemies[i].draw(ctx, time);

  const bullets = G.bulletPool.active;
  for (let i = 0; i < bullets.length; i++) bullets[i].draw(ctx, time);

  if (G.player && G.player.alive) G.player.draw(ctx, time);

  G.drawDrones(ctx, time);
  G.drawGuards(ctx, time);
  G.drawStrikers(ctx, time);

  G.particles.draw(ctx, time);

  // 连杀
  if (G.combo.count >= 3) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const pulse = 1 + Math.sin(time * 8) * 0.05;
    ctx.font = `bold ${28 * pulse}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = G.combo.count >= 10 ? '#f44' : G.combo.count >= 6 ? '#fa4' : '#ff4';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 15;
    ctx.fillText(`${G.combo.count} COMBO x${G.combo.multiplier}`, G.renderer.centerX, 80);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // 准星
  if (G.player && G.player.alive) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const mx = G.input.mouse.x, my = G.input.mouse.y;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    const sz = 12;
    ctx.beginPath(); ctx.arc(mx, my, sz, 0, G.TWO_PI); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mx-sz-4,my); ctx.lineTo(mx-sz+4,my);
    ctx.moveTo(mx+sz-4,my); ctx.lineTo(mx+sz+4,my);
    ctx.moveTo(mx,my-sz-4); ctx.lineTo(mx,my-sz+4);
    ctx.moveTo(mx,my+sz-4); ctx.lineTo(mx,my+sz+4);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,100,100,0.8)';
    ctx.beginPath(); ctx.arc(mx, my, 2, 0, G.TWO_PI); ctx.fill();
    ctx.restore();
  }
}

// ═══════════════ HUD ═══════════════
function updateHUD() {
  document.getElementById('hud-wave').textContent = G.gameData.wave;
  document.getElementById('hud-score').textContent = G.gameData.score;
  document.getElementById('hud-kills').textContent = G.gameData.kills;
  // 显示可用点数
  const used = getUsedPoints();
  const freePoints = loadout.availablePoints - used;
  document.getElementById('hud-points').textContent = freePoints > 0 ? `+${freePoints}` : '0';
  document.getElementById('hud-points').style.color = freePoints > 0 ? '#4f4' : '#adf';
  if (G.player) {
    const pct = (G.player.hp / G.player.maxHp) * 100;
    document.getElementById('hp-bar').style.width = `${pct}%`;
    document.getElementById('hp-text').textContent = `${Math.ceil(G.player.hp)} / ${G.player.maxHp}`;
    // 护盾显示
    const shieldEl = document.getElementById('shield-bar');
    if (shieldEl) {
      if (G.player.maxShield > 0 || G.player.shield > 0) {
        shieldEl.style.display = 'block';
        const cap = Math.max(G.player.maxShield, G.player.shield);
        shieldEl.style.width = `${Math.min(100, (G.player.shield / cap) * 100)}%`;
      } else {
        shieldEl.style.display = 'none';
      }
    }
  }
  if (G.weaponSystem.weapon) {
    document.getElementById('hud-weapon').textContent = G.weaponSystem.weapon.name;
  }
  updateGeneBar();
}

// ═══════════════ 基因buff栏 ═══════════════
let lastGeneSig = null;
function updateGeneBar() {
  const bar = document.getElementById('gene-bar');
  if (!bar) return;
  const keys = Object.keys(G.geneBuffs).sort();
  const sig = keys.join(',');
  if (sig !== lastGeneSig) {
    lastGeneSig = sig;
    bar.innerHTML = '';
    for (const t of keys) {
      const m = G.GeneMeta[t] || { icon: 'gene', color: '#adf' };
      const chip = document.createElement('div');
      chip.className = 'gene-chip';
      chip.style.borderColor = m.color;
      chip.title = G.t('gene_' + t);
      chip.innerHTML = `${G.icon(m.icon, m.color)}<b id="gene-sec-${t}"></b>`;
      bar.appendChild(chip);
    }
  }
  for (const t of keys) {
    const el = document.getElementById('gene-sec-' + t);
    if (el) el.textContent = Math.ceil(G.geneBuffs[t]) + 's';
  }
}

// ═══════════════ 装备系统（统一点数池） ═══════════════
const loadout = {
  weaponPoints: { power:1, rate:1, pierce:0, homing:0, burst:0, split:0, lifetime:1, dot:0, zone:0, bounce:0, burn:0, freeze:0, shock:0, lifesteal:0, knockback:0, seal:0, charm:0, drone:0, striker:0 },
  shipPoints: { hull:1, regen:0, reflect:0, shield:0, reactive:0, guard:0 },
  activePreset: null,
  availablePoints: G.POINT_START, // 战前可用点数
};

function getUsedPoints() {
  return Object.values(loadout.weaponPoints).reduce((s,v) => s+v, 0)
       + Object.values(loadout.shipPoints).reduce((s,v) => s+v, 0);
}

// ═══════════════ 加点卡牌系统 ═══════════════
const cardColors = {
  power:'#f44', rate:'#4af', pierce:'#fa4', homing:'#c4f', burst:'#f84',
  split:'#f4c', lifetime:'#4fd', dot:'#9d4', zone:'#f44', bounce:'#8f4',
  burn:'#f60', freeze:'#4cf', shock:'#84f',
  lifesteal:'#f6a', knockback:'#fd4', seal:'#a6f', charm:'#f6c', drone:'#6cf', striker:'#8f4',
  hull:'#f44', regen:'#4f4', reflect:'#fa4', shield:'#4af', reactive:'#fd8', guard:'#4dd',
};
const ALL_ALLOC_KEYS = [...Object.keys(G.StatMeta), ...Object.keys(G.ShipMeta)];

function getStatVal(key) {
  return key in loadout.weaponPoints ? loadout.weaponPoints[key] : loadout.shipPoints[key];
}

// 随机卡牌池：已加点属性必出现（点数高者优先），其余随机补足 count 项
function rollStatPool(count) {
  const withPts = ALL_ALLOC_KEYS.filter(k => getStatVal(k) > 0).sort((a, b) => getStatVal(b) - getStatVal(a));
  const rest = ALL_ALLOC_KEYS.filter(k => getStatVal(k) === 0);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  return [...withPts, ...rest].slice(0, count);
}

// 渲染单张加点卡牌（pfx 区分战前/波次弹窗的元素 id）
function renderStatCard(pfx, key, onClick) {
  const sys = key in G.StatMeta ? 'weapon' : 'ship';
  const meta = G.StatMeta[key] || G.ShipMeta[key];
  const color = cardColors[key] || '#4af';
  const val = getStatVal(key);
  const card = document.createElement('div');
  card.className = 'stat-card' + (val > 0 ? ' has-pts' : '');
  card.id = `${pfx}card-${key}`;
  card.style.setProperty('--card-color', color);
  card.innerHTML = `
    <div class="stat-card-head">
      <span class="stat-card-icon">${G.icon(meta.icon, color)}</span>
      <span class="stat-card-name">${G.t(meta.label)}</span>
      ${sys === 'ship' ? `<span class="stat-card-tag">${G.t('ship_tag')}</span>` : ''}
      <span class="stat-card-val" id="${pfx}val-${key}">${val}</span>
    </div>
    <div class="stat-card-desc">${G.t(meta.desc)}</div>
    <div class="stat-card-bar-wrap"><div class="stat-card-bar" id="${pfx}bar-${key}" style="width:${(val/G.POINT_MAX)*100}%;background:${color}"></div></div>
    <div class="stat-card-btns">
      <button class="alloc-btn" data-dir="-1">−</button>
      <button class="alloc-btn" data-dir="1">+</button>
    </div>`;
  card.querySelectorAll('.alloc-btn').forEach(btn => {
    btn.onclick = () => onClick(sys, key, parseInt(btn.dataset.dir));
  });
  return card;
}

// 刷新指定前缀下所有卡牌的数值/进度条/高亮
function updateCards(pfx) {
  for (const key of ALL_ALLOC_KEYS) {
    const el = document.getElementById(`${pfx}val-${key}`);
    if (!el) continue;
    const val = getStatVal(key);
    el.textContent = val;
    const bar = document.getElementById(`${pfx}bar-${key}`);
    if (bar) bar.style.width = `${(val / G.POINT_MAX) * 100}%`;
    const card = document.getElementById(`${pfx}card-${key}`);
    if (card) card.classList.toggle('has-pts', val > 0);
  }
}

function buildLoadout() {
  const row = document.getElementById('preset-row');
  row.innerHTML = '';
  for (const [key, preset] of Object.entries(G.WeaponPresets)) {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.innerHTML = `${G.icon(preset.icon, '#8cf')} ${G.t('preset_' + key)}`;
    btn.dataset.key = key;
    btn.onclick = () => selectPreset(key);
    row.appendChild(btn);
  }

  // 初始随机20张加点卡牌（语言切换/重进时保持同一套随机结果）
  if (!loadout.cardPool) loadout.cardPool = rollStatPool(G.INIT_CARD_COUNT);
  renderLoadoutCards();

  refreshLoadoutUI();
  startPreviewLoop();
}

function renderLoadoutCards() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  for (const key of loadout.cardPool) grid.appendChild(renderStatCard('c', key, allocPoint));
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === loadout.activePreset);
  });
}

function selectPreset(key) {
  const preset = G.WeaponPresets[key];
  if (!preset) return;
  // 使用权重系统自动分配点数
  const weaponPoints = G.buildPresetPoints(key, loadout.availablePoints);
  if (!weaponPoints) return;
  loadout.weaponPoints = weaponPoints;
  loadout.shipPoints = { hull: 1, regen: 0, reflect: 0, shield: 0, reactive: 0, guard: 0 };
  loadout.activePreset = key;
  // 模板可突破随机卡牌池限制：所有获得点数的属性补发卡牌
  for (const k of ALL_ALLOC_KEYS) {
    if (getStatVal(k) > 0 && !loadout.cardPool.includes(k)) loadout.cardPool.push(k);
  }
  renderLoadoutCards();
  refreshLoadoutUI();
}

function allocPoint(sys, key, dir) {
  const pts = sys === 'weapon' ? loadout.weaponPoints : loadout.shipPoints;
  const used = getUsedPoints();

  if (dir > 0 && used >= loadout.availablePoints) return;
  if (dir > 0 && pts[key] >= G.POINT_MAX) return;
  if (dir < 0 && pts[key] <= 0) return;

  pts[key] += dir;
  if (sys === 'weapon') loadout.activePreset = null;
  refreshLoadoutUI();
}

function refreshLoadoutUI() {
  const used = getUsedPoints();
  document.getElementById('points-remain').textContent = loadout.availablePoints - used;
  document.getElementById('points-total').textContent = loadout.availablePoints;

  updateCards('c');
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === loadout.activePreset);
  });

  // 武器预览
  const weapon = G.buildWeaponFromPoints(loadout.weaponPoints);
  document.getElementById('preview-name').textContent = weapon.name;
  document.getElementById('preview-name').style.color = weapon.color;

  const stats = document.getElementById('preview-stats');
  stats.innerHTML = `
    <div class="ps-row"><span>${G.t('preview_damage')}</span><span class="ps-val">${weapon.damage.toFixed(0)}</span></div>
    <div class="ps-row"><span>${G.t('preview_rate')}</span><span class="ps-val">${weapon.fireRate.toFixed(1)}/s</span></div>
    <div class="ps-row"><span>${G.t('preview_pierce')}</span><span class="ps-val">${weapon.penetration}</span></div>
    <div class="ps-row"><span>${G.t('preview_homing')}</span><span class="ps-val">${(weapon.homing*100).toFixed(0)}%</span></div>
    <div class="ps-row"><span>${G.t('preview_burst')}</span><span class="ps-val">${weapon.burst}</span></div>
    <div class="ps-row"><span>${G.t('preview_split')}</span><span class="ps-val">${weapon.split}</span></div>
    <div class="ps-row"><span>${G.t('preview_lifetime')}</span><span class="ps-val">${weapon.maxLife.toFixed(1)}s</span></div>
    <div class="ps-row"><span>${G.t('preview_dot')}</span><span class="ps-val">4/s × ${weapon.dot.toFixed(0)}s</span></div>
    <div class="ps-row"><span>${G.t('preview_zone')}</span><span class="ps-val">${weapon.zoneRadius.toFixed(0)}</span></div>
    <div class="ps-row"><span>${G.t('preview_bounce')}</span><span class="ps-val">${weapon.bounce}</span></div>
    <div class="ps-row"><span>${G.t('preview_burn')}</span><span class="ps-val">${weapon.burnDps.toFixed(0)}~${(weapon.burnDps * 6).toFixed(0)}/s</span></div>
    <div class="ps-row"><span>${G.t('preview_freeze')}</span><span class="ps-val">+${weapon.freezePower.toFixed(0)}%</span></div>
    <div class="ps-row"><span>${G.t('preview_shock')}</span><span class="ps-val">×${weapon.shockPoints}</span></div>
    <div class="ps-row"><span>${G.t('preview_drone')}</span><span class="ps-val">${weapon.droneCount > 0 ? '×' + weapon.droneCount : '—'}</span></div>
    <div class="ps-row"><span>${G.t('preview_striker')}</span><span class="ps-val">${weapon.strikerCount > 0 ? '×' + weapon.strikerCount : '—'}</span></div>
  `;

  // 飞船预览
  const ship = G.buildShipFromPoints(loadout.shipPoints);
  const sStats = document.getElementById('ship-stats');
  sStats.innerHTML = `
    <div class="ps-row"><span>${G.t('preview_hp')}</span><span class="ps-val">${ship.maxHp}</span></div>
    <div class="ps-row"><span>${G.t('preview_regen')}</span><span class="ps-val">${ship.regen.toFixed(0)}/s</span></div>
    <div class="ps-row"><span>${G.t('preview_reflect')}</span><span class="ps-val">${ship.reflect.toFixed(0)}</span></div>
    <div class="ps-row"><span>${G.t('preview_shield')}</span><span class="ps-val">${ship.maxShield}</span></div>
    <div class="ps-row"><span>${G.t('preview_reactive')}</span><span class="ps-val">${ship.reactive > 0 ? '×' + ship.reactive : '—'}</span></div>
    <div class="ps-row"><span>${G.t('preview_guard')}</span><span class="ps-val">${ship.guard > 0 ? '×' + ship.guard : '—'}</span></div>
  `;

  const shapeNames = { orb: G.t('shape_orb'), streak: G.t('shape_streak'), needle: G.t('shape_needle'),
    crescent: G.t('shape_crescent'), star: G.t('shape_star'), cluster: G.t('shape_cluster'), dart: G.t('shape_dart') };
  document.getElementById('preview-shape').textContent =
    `${G.t('shape_label')}: ${shapeNames[weapon.bulletShape.primary]||'?'} ${weapon.bulletShape.blend>0.3?'+ '+(shapeNames[weapon.bulletShape.secondary]||''):''}`;
}

// ── 预览Canvas循环 ──
let previewRAF = null;
function startPreviewLoop() {
  const pCanvas = document.getElementById('preview-canvas');
  const pCtx = pCanvas.getContext('2d');

  function drawPreview(time) {
    const t = time / 1000;
    pCtx.clearRect(0, 0, 240, 240);

    // ── 子弹预览（上半部分） ──
    const weapon = G.buildWeaponFromPoints(loadout.weaponPoints);
    const r = Math.max(8, weapon.bulletRadius * 3);
    const angle = t * 1.5;
    G.drawBulletShape(pCtx, 120, 70, angle, r, weapon.bulletShape, weapon.color, t);

    // 子弹轨道粒子
    for (let i = 0; i < 3; i++) {
      const a = t * 2 + i * (G.TWO_PI / 3);
      const d = 35 + Math.sin(t * 3 + i) * 8;
      pCtx.fillStyle = weapon.color; pCtx.globalAlpha = 0.3;
      pCtx.beginPath(); pCtx.arc(120 + Math.cos(a)*d, 70 + Math.sin(a)*d, 2, 0, G.TWO_PI); pCtx.fill();
    }
    pCtx.globalAlpha = 1;

    // ── 分割线 ──
    pCtx.strokeStyle = 'rgba(100,150,220,0.2)'; pCtx.lineWidth = 1;
    pCtx.beginPath(); pCtx.moveTo(30, 135); pCtx.lineTo(210, 135); pCtx.stroke();

    // ── 飞船预览（下半部分） ──
    const ship = G.buildShipFromPoints(loadout.shipPoints);
    pCtx.save();
    pCtx.translate(120, 185);
    const s = ship.visual.scale * 0.7;
    pCtx.scale(s, s);

    // 简单三角飞船（朝上）
    const shipColor = ship.visual.color;

    // 引擎光
    const flameLen = 8 + Math.sin(t * 12) * 3;
    const fGrad = pCtx.createLinearGradient(0, 14, 0, 14 + flameLen);
    fGrad.addColorStop(0, 'rgba(100,180,255,0.8)');
    fGrad.addColorStop(1, 'rgba(0,100,255,0)');
    pCtx.fillStyle = fGrad;
    pCtx.beginPath(); pCtx.moveTo(-4, 14); pCtx.lineTo(0, 14+flameLen); pCtx.lineTo(4, 14); pCtx.closePath(); pCtx.fill();

    // 主体三角
    pCtx.shadowColor = shipColor; pCtx.shadowBlur = 10;
    const bodyGrad = pCtx.createLinearGradient(0, -20, 0, 14);
    bodyGrad.addColorStop(0, '#fff');
    bodyGrad.addColorStop(0.3, shipColor);
    bodyGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
    pCtx.fillStyle = bodyGrad;
    pCtx.beginPath();
    pCtx.moveTo(0, -20); pCtx.lineTo(-14, 14); pCtx.lineTo(14, 14);
    pCtx.closePath(); pCtx.fill();
    pCtx.shadowBlur = 0;

    // 核心点
    pCtx.fillStyle = '#fff'; pCtx.globalAlpha = 0.8;
    pCtx.beginPath(); pCtx.arc(0, 0, 3, 0, G.TWO_PI); pCtx.fill();
    pCtx.globalAlpha = 1;

    // 护盾环
    if (ship.visual.hasShield) {
      pCtx.strokeStyle = `rgba(80,180,255,${0.4+0.3*Math.sin(t*4)})`;
      pCtx.lineWidth = 2;
      pCtx.beginPath(); pCtx.arc(0, 0, 22, 0, G.TWO_PI); pCtx.stroke();
    }
    // 反伤尖刺
    if (ship.visual.hasSpikes) {
      pCtx.fillStyle = `rgba(255,160,60,${0.6+0.3*Math.sin(t*5)})`;
      const spikeAngles = [-0.4, 0.4, Math.PI*0.7, -Math.PI*0.7];
      for (const sa of spikeAngles) {
        pCtx.beginPath();
        pCtx.moveTo(Math.cos(sa)*22, Math.sin(sa)*22);
        pCtx.lineTo(Math.cos(sa-0.15)*15, Math.sin(sa-0.15)*15);
        pCtx.lineTo(Math.cos(sa+0.15)*15, Math.sin(sa+0.15)*15);
        pCtx.closePath(); pCtx.fill();
      }
    }
    // 回复光环
    if (ship.visual.hasAura) {
      pCtx.strokeStyle = `rgba(80,255,120,${0.2+0.1*Math.sin(t*4)})`;
      pCtx.lineWidth = 1;
      pCtx.beginPath(); pCtx.arc(0, 0, 26+Math.sin(t*2)*3, 0, G.TWO_PI); pCtx.stroke();
    }

    pCtx.restore();
    previewRAF = requestAnimationFrame(drawPreview);
  }
  if (previewRAF) cancelAnimationFrame(previewRAF);
  previewRAF = requestAnimationFrame(drawPreview);
}

// ═══════════════ 开始/结束 ═══════════════
function startGame() {
  document.getElementById('loadout-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  document.body.classList.remove('menu-active');
  if (previewRAF) { cancelAnimationFrame(previewRAF); previewRAF = null; }

  // 构建武器
  const weapon = G.buildWeaponFromPoints(loadout.weaponPoints);
  G.weaponSystem.setWeapon(weapon);

  // 构建飞船
  const shipConfig = G.buildShipFromPoints(loadout.shipPoints);

  // 重置
  G.bulletPool.releaseAll();
  G.enemyPool.releaseAll();
  G.particles.pool.releaseAll();
  G.weaponSystem.aoeBlasts = [];
  G.weaponSystem.blackholes = [];
  G.weaponSystem.chainLightnings = [];
  G.weaponSystem.damageZones = [];
  G.weaponSystem.orbitalBullets = [];

  G.gameData.score = 0;
  G.gameData.wave = 1;
  G.gameData.kills = 0;
  G.gameData.state = G.State.PLAYING;
  G.gameData.paused = false;
  G.clearGenes(); // 清除上局残留的基因buff
  lastGeneSig = null;

  G.player = new G.Player(G.renderer.centerX, G.renderer.centerY, shipConfig);
  G.player.invincible = 2;
  G.syncDrones(weapon.droneCount); // 同步无人机数量
  G.syncGuards(shipConfig.guard); // 同步防御无人机数量
  G.syncStrikers(weapon.strikerCount); // 同步进攻无人机数量
  G.waveManager = new G.WaveManager(G.enemyPool, G.events);

  // 轨道弹（bounce > 2 时生成环绕飞船的轨道弹）
  if (weapon.bounce > 2) {
    const count = Math.floor(weapon.bounce / 2);
    for (let i = 0; i < count; i++) {
      G.weaponSystem.orbitalBullets.push(new G.OrbitalBullet(
        G.player, 50 + i * 15, (i / count) * G.TWO_PI,
        3 + i * 0.5, weapon.damage * 0.3, weapon.bulletRadius * 0.8, weapon.color
      ));
    }
  }
}

// ═══════════════ 波次间加点 ═══════════════
function showWaveAlloc() {
  G.gameData.paused = true;
  document.body.classList.add('menu-active');
  const overlay = document.getElementById('wave-alloc');
  overlay.classList.remove('hidden');

  const used = getUsedPoints();
  const free = loadout.availablePoints - used;
  document.getElementById('wave-pts').textContent = free;

  // 随机10张加点卡牌（无模板；已加点属性必出现）
  const pool = rollStatPool(G.WAVE_CARD_COUNT);
  const grid = document.getElementById('wave-alloc-grid');
  grid.innerHTML = '';
  for (const key of pool) grid.appendChild(renderStatCard('wc', key, waveAllocPoint));
}

function waveAllocPoint(sys, key, dir) {
  const pts = sys === 'weapon' ? loadout.weaponPoints : loadout.shipPoints;
  const used = getUsedPoints();
  if (dir > 0 && used >= loadout.availablePoints) return;
  if (dir > 0 && pts[key] >= G.POINT_MAX) return;
  if (dir < 0 && pts[key] <= 0) return;
  pts[key] += dir;

  // 刷新显示
  const usedNow = getUsedPoints();
  const free = loadout.availablePoints - usedNow;
  document.getElementById('wave-pts').textContent = free;
  updateCards('wc');
}

function closeWaveAlloc() {
  document.getElementById('wave-alloc').classList.add('hidden');
  G.gameData.paused = false;
  document.body.classList.remove('menu-active');
  // 应用飞船属性（如果还活着）
  if (G.player && G.player.alive) {
    const ship = G.buildShipFromPoints(loadout.shipPoints);
    G.player.maxHp = ship.maxHp;
    G.player.regen = ship.regen;
    G.player.reflect = ship.reflect;
    G.player.maxShield = ship.maxShield;
    G.player.reactive = ship.reactive;
    G.player.visual = ship.visual;
    // 重建武器
    const weapon = G.buildWeaponFromPoints(loadout.weaponPoints);
    G.weaponSystem.setWeapon(weapon);
    G.syncDrones(weapon.droneCount); // 同步无人机数量
    G.syncGuards(ship.guard); // 同步防御无人机数量
    G.syncStrikers(weapon.strikerCount); // 同步进攻无人机数量
  }
  // 恢复波次
  G.waveManager.pauseBetweenWaves = false;
  G.waveManager.betweenTimer = 2;
}

document.getElementById('wave-alloc-continue').addEventListener('click', closeWaveAlloc);

function showGameOver() {
  document.getElementById('gameover-screen').classList.remove('hidden');
  document.getElementById('go-wave').textContent = G.gameData.wave;
  document.getElementById('go-score').textContent = G.gameData.score;
  document.getElementById('go-kills').textContent = G.gameData.kills;
  document.body.classList.add('menu-active');
  G.playfun.endGame(); // Play.fun：游戏结束提交本局累计积分
}

function backToLoadout() {
  document.getElementById('gameover-screen').classList.add('hidden');
  document.getElementById('loadout-screen').classList.remove('hidden');
  document.body.classList.add('menu-active');
  // 失败后重置点数
  loadout.availablePoints = G.POINT_START;
  loadout.weaponPoints = { power:0, rate:0, pierce:0, homing:0, burst:0, split:0, lifetime:0, dot:0, zone:0, bounce:0, burn:0, freeze:0, shock:0, lifesteal:0, knockback:0, seal:0, charm:0, drone:0, striker:0 };
  loadout.shipPoints = { hull:1, regen:0, reflect:0, shield:0, reactive:0, guard:0 };
  loadout.activePreset = null;
  loadout.cardPool = null; // 重新随机一套加点卡牌
  buildLoadout();
}

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', backToLoadout);

// ═══════════════ 语言切换 ═══════════════
document.getElementById('btn-lang').addEventListener('click', () => {
  const newLang = G.currentLang === 'zh' ? 'en' : 'zh';
  G.applyLang(newLang);
  lastGeneSig = null; // 刷新基因栏文案
  // 重建加点界面（刷新标签）
  buildLoadout();
  startPreviewLoop();
});

// ═══════════════ 初始化装备界面 ═══════════════
G.applyLang(); // 应用保存的语言
buildLoadout();

// ═══════════════ 启动 ═══════════════
G.gameLoop.start(update, render);
console.log('[Game] 🚀 基因战机 v3 (i18n + wave alloc) 已启动');


</script>
